; 3VN Robotics - ESP32 firmware
;
; The wire protocol is NOT duplicated here. build_flags reaches into the
; ROS package for protocol.hpp, so the firmware and the host compile the
; same definition of every frame. A protocol written twice is a protocol
; that drifts, and the drift shows up as an arm moving to the wrong place
; rather than as a compile error.
;
;   pio run                 build
;   pio run -t upload       flash
;   pio device monitor      watch the log (frames are binary; see below)
;
; The device speaks binary on the SAME port it is flashed over, so a
; terminal shows garbage. Diagnostics go to Serial1 instead - wire a
; USB-serial adapter to GPIO17 to read them.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

build_flags =
    -I../../src/threevn_hardware/include
    -Iinclude
    -std=gnu++17
    -Wall
    -Wextra

build_unflags = -std=gnu++11

lib_deps =
    madhephaestus/ESP32Servo@^3.0.5
