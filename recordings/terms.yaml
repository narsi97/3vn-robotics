# Which words stay in English when a recording is dubbed or subtitled.
#
# The recordings are made once, in English. The audio is then dubbed and
# the transcript translated into Indian languages. The written lessons,
# the commands and the code are NOT translated: a learner types `make
# sim`, reads `/joint_states` in a terminal and searches for
# "ros2_control" whatever language they think in.
#
# So the test for every term is one question:
#
#     Will the learner TYPE it, READ it on screen, or SEARCH for it?
#
#       yes -> it stays in English, said in English inside the
#              local-language sentence, the way engineers in India
#              already speak
#       no  -> it is an idea, and it is explained in the local language,
#              with the English term given ONCE at first use
#
# This is a STARTING classification, made by someone who does not speak
# the target languages. The reviewer for each language owns the final
# call and should change anything that sounds wrong to a native ear.
# What a reviewer should not change is the rule above.
#
# A translation step reads this file as data:
#
#   never_translate  names. Written exactly as shown, in Latin script,
#                    in every language. `say` is how a voice should
#                    pronounce it; without it, speech tools spell some
#                    of these out and mangle others.
#   keep_in_english  vocabulary. Left as the English word. May be
#                    inflected by the surrounding language.
#   translate        ideas. Explained in the local language; the English
#                    term appears once, in brackets, where it is
#                    introduced.
#
# Subtitles keep `never_translate` and `keep_in_english` terms in Latin
# script by default, because that is what appears on the screen beside
# them. A language's reviewer may choose transliteration for
# `keep_in_english` terms instead; never for `never_translate`.
#
# `make terms-check` fails if a term in the course glossary is in none
# of the three lists, or in two.

version: 1

rules:
  - id: code-is-never-translated
    text: >-
      Anything shown in code font or typed at a terminal is never
      translated, transliterated or spoken as a translation: commands,
      flags, file names, joint, topic and frame names, YAML keys, and
      error text quoted from the screen.
  - id: say-what-it-does-not-what-it-is-spelt
    text: >-
      Narration does not read a command aloud character by character.
      It says what the command does; the command itself is on screen.
  - id: numbers-and-units
    text: >-
      Numbers and units are spoken in the target language's normal way,
      and written as digits with SI symbols (1.3 N·m, 50 Hz, 20 ms).
  - id: first-use
    text: >-
      A `translate` term gives its English form once, in brackets, where
      the idea is introduced, so a learner can find it in the written
      lessons.

# -- names -------------------------------------------------------------
