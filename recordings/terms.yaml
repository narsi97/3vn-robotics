# -- ideas: explain in the local language, English once at first use ----
#
# Every entry is a term from the course glossary. `because` is there
# only where the choice is not obvious.
translate:
  - term: hardware seam
    because: >-
      The course's own central idea, not an industry word. Explain it,
      and keep the English "seam" beside it: it is in lesson titles.
  - term: execution target
  - term: hidden assumption
  - term: structural guard
  - term: independent oracle
  - term: control case
  - term: discriminating metric
  - term: decision check
  - term: defence in depth
  - term: fail closed
    because: >-
      Explain as "when the check cannot be made, refuse". Give "fail
      open" beside it once; the pair is what a learner searches for.
  - term: security through obscurity
  - term: separation of duties
  - term: pin versus checksum
    because: Keep "pin" and "checksum"; translate the contrast.
  - term: trust on first use (TOFU)
    because: Keep "TOFU" as the name; explain what is trusted, and when.
  - term: safe failure state
  - term: command validation
  - term: command watchdog
    because: Keep "watchdog"; translate the rest.
  - term: latching e-stop
    because: Keep "e-stop"; translate "latching".
  - term: belief versus ground truth
    because: Keep "ground truth"; translate the contrast.
  - term: polling a post-condition
    because: Keep "post-condition"; translate "polling" as checking repeatedly.
  - term: staleness
  - term: test budget
  - term: test layer
  - term: test matrix
  - term: shared fixture
  - term: CI parity
    because: Keep "CI"; translate the idea of "the same everywhere".
  - term: single source of version
  - term: release manifest
  - term: dataset manifest
  - term: content-addressed version
  - term: provenance
    because: >-
      Explain as "where a number came from". Its four values (measured,
      datasheet, estimated, computed) are typed, and stay in English.
  - term: approval gate
  - term: promotion gate
  - term: pull before stop
  - term: pull-based rollback
    because: Keep "rollback".
  - term: push telemetry
  - term: memory limiter
  - term: metric name translation
  - term: feature contract
  - term: interface contract
  - term: shadow baseline
    because: Keep "baseline".
  - term: composition
  - term: host-side control loop
  - term: headless simulation
    because: Keep "headless".
  - term: software rendering
  - term: framebuffer streaming
  - term: message-level visualisation
  - term: framing
  - term: resynchronisation
  - term: preflight check
  - term: closed kinematic chain
  - term: tipping margin
  - term: per-leg error
  - term: gyro bias
  - term: edge bleed
  - term: pinch point
  - term: print clearance
  - term: support-free printing
  - term: derivative work
    because: A legal idea. Explain it plainly and give the English term.
  - term: architecture decision record (ADR)
    because: Keep "ADR" as the name; explain what it records.
  - term: bill of materials (BOM)
    because: Keep "BOM" as the name; explain what it lists.
  - term: Gazebo extension tag
    because: Keep "Gazebo" and the tag itself; translate "extension".
  - term: action goal status
    because: Keep "action" and the status values, which are read on screen.
  - term: DDS discovery
    because: Keep "DDS"; translate "discovery" as how nodes find each other.
