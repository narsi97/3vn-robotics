id: capable
number: 6
kind: tier
title: Make it capable
price: "$5"
summary: >-
  A robot that drives, knows roughly where it is, carries an arm, reaches
  for things, sees them, records what it saw, learns from it, ships the
  model like software — and is then pointed at a robot nobody here
  designed. Including the parts that do not work yet.

outcomes:
  - Measure a robot's own estimates against ground truth, and fuse two bad sensors into a better one.
  - Compose two robots into one without editing either, and compute whether the result can tip itself over.
  - Solve an arm's inverse kinematics in closed form, and map what it can and cannot reach.
  - Verify a grasp with two independent checks and a control — and report honestly when it fails.
  - Turn pixels into metres, measure the error distribution, and find its physical cause.
  - Build a dataset whose test set means something, fit a model that beats a closed-form baseline honestly, and ship it with gates, rollback and drift detection.
  - Run the stack against a foreign robot and find the single assumption that breaks.

prerequisites:
  - Tier 5 complete.
  - Docker with 8 GB if you can spare it — the mobile manipulator with a camera is the heaviest thing in the course.
  - Patience for one long recording — about 25 minutes of simulated driving for the dataset.

lessons:
  - id: it-drives
    title: Odometry lies, and by how much
    minutes: 35
    objective: Measure the gap between where the wheels think the robot is and where it actually is.
    body: |
      The base is its own robot first: four wheels, skid steer, which is what
      cheap chassis kits are. Its wheels are **velocity-commanded** — you
      never tell a wheel where to be — and their joints are **continuous**,
      because a travel limit on a wheel makes the controller fight it after a
      few metres.

      Wheel odometry is dead reckoning: count wheel turns, integrate, believe
      the answer. It is wrong immediately and increasingly, and skid steer is
      worse than most, because turning *scrubs* the wheels sideways rather
      than rolling them, and the model does not represent that.

      What matters is that it is **measured**, and against the right thing.
      Comparing odometry to the *command* proves only that the controller
      tracks its setpoint — both sides come from the same wheel encoders, so
      neither can see slip. A base bolted to the floor would report a perfect
      turn. The simulator offers ground truth for free, and that is the one
      place you can grade your own estimator honestly:

      | leg | odometry | ground truth | error |
      |---|---|---|---|
      | forward 0.9 m | 0.882 m | 0.882 m | 0.0% |
      | rotate 114.6° | 112.3° | 89.0° | **+26%** |

      Straight lines are essentially exact. Heading is not. The standard
      correction — a multiplier on the track width — was measured too, and it
      **saturates**: from +63% error at 1.0 down to +26% at 2.4, and no
      further, because it scales the command and the odometry together. A
      single constant cannot represent scrub. About a quarter of every turn
      is simply lost.

      Two cautions about your own measurements. Restart the simulator before
      trusting a number: a degraded, long-running Gazebo once produced a "12%
      shortfall" that was not a physics finding at all. And print the number
      from a script you can re-run — a figure from a hand run, once, is a
      memory, not a measurement.
    steps:
      - do: Start the base on its own.
        run: make base-sim
      - do: In a second terminal, drive a fixed path and compare odometry against ground truth.
        run: make base-drive
        expect: >-
          Linear error near 0%, and a heading error in the tens of percent.
          The doc's table says +26%; the run that verified this lesson said
          +16.7%. Same code, same world — which is the next lesson's warning
          about single measurements, arriving early.
      - do: Find the correction constant, and the covariances that admit heading is weak.
        run: grep -n -E "wheel_separation_multiplier|covariance" src/threevn_bringup/config/base_controllers.yaml
      - do: Check the velocity topic's type, the fastest diagnosis for a base that will not move.
        run: |
          make shell
          ros2 topic info /base_controller/cmd_vel
    checkpoint: >-
      You have a heading error for the base, measured against ground truth by
      a script, rather than assumed.
    pitfalls:
      - symptom: The base drives forward but refuses to rotate.
        cause: Wheel friction equal in both directions. Skid steer turns by sliding sideways.
        fix: Sideways friction (`mu2`) much lower than rolling friction (`mu1`).
      - symptom: A measurement looks like a physics finding and does not reproduce.
        cause: A long-running simulator in a degraded state.
        fix: Restart `make base-sim` before measuring.
      - symptom: The base will not move at all, and no log shows an error.
        cause: A velocity publisher of the wrong message type. A parameter meant to fix this did not exist on this ROS version and was silently ignored.
        fix: '`ros2 topic info /base_controller/cmd_vel` and publish `TwistStamped`.'
    concepts:
      - term: Odometry
        meaning: >-
          Estimating position by integrating motion — here, wheel rotation.
          Drifts without bound.
      - term: Skid steer
        meaning: >-
          Steering by driving the wheels on each side at different speeds, so
          turns scrub the wheels sideways.
      - term: Ground truth
        meaning: >-
          The true value, known exactly — available in simulation, expensive
          or impossible on a real robot.
    quiz:
      - q: Why does comparing odometry to the command prove nothing about slip?
        a: >-
          Both come from the wheel encoders. If a wheel slips, the encoder and
          the odometry agree with each other and are both wrong.
      - q: Why does the track-width multiplier stop helping?
        a: >-
          It scales the command and the odometry together, so it can shrink
          the error but never close it. Scrub is not a fixed track-width
          error.
    exercise:
      task: >-
        Run `make base-drive` three times against the same running simulator,
        then three times against freshly started ones. Do the two sets agree?
        What does that tell you about when a measurement should be trusted?
    read:
      - mobile-base.md

  - id: two-wrong-answers
    title: Two wrong answers, one better one
    minutes: 35
    objective: Fuse a gyro with wheel odometry, and prove with the right metric that it helped.
    body: |
      The wheels are bad at heading, because they scrub. A gyroscope is good
      at heading over seconds and bad over minutes, because integrating a
      slightly biased rate accumulates. Neither is right; together they are
      better — heading from the gyro, distance from the wheels.

      The gyro costs about **$2**. Driving four turns against ground truth:

      | source | mean error per turn |
      |---|---|
      | wheel odometry | 17.6° |
      | gyro alone | 0.2° |
      | fused | 0.2° |

      Roughly 88 times better than the calibration constant that provably
      could not fix it.

      Position uses the wheel *distance* carried along the *gyro* heading. A
      model that thinks it turned 45° when it turned 68° travels the right
      distance in the wrong direction, and the error compounds every leg even
      though the odometer was right.

      The gyro's bias is measured while the robot is still — and "still" is
      judged by the **wheels**, not by the gyro. Using the gyro to decide
      whether to trust the gyro is a loop that would calibrate away a real
      slow rotation. Each sensor covers the other's weakness.

      Now the lesson that cost real time. The first summary metric reported
      *net* heading error after a sequence of turns that netted to zero. By
      that measure the wheels scored **better** than the gyro, +0.4° against
      −0.6°. Wheel error is proportional to rotation, so equal and opposite
      turns cancelled it — every individual turn was 30% short while the
      total looked perfect. The gyro was fine. The metric had stopped
      telling apart two things known to differ, which means the
      **measurement** was broken, not the system. It was replaced with
      per-leg absolute error.

      And the claim is stated with its limit: the fused heading still
      drifts. Nothing on this robot provides an absolute heading, so the
      error is a random walk. The claim is much slower drift, not bounded
      drift.
    steps:
      - do: Start the whole robot in the target world.
        run: make mm-sim WORLD=bench_with_target
      - do: Start the fusion node in a second terminal.
        run: make fused-odom
      - do: In a third, drive the four turns and compare every source against ground truth.
        run: make heading
        expect: A per-leg table — wheel, gyro, fused, truth — with wheel odometry many degrees out and the gyro within a fraction of a degree.
    checkpoint: >-
      Per-leg heading error is lower with the gyro than without it, by the
      per-leg metric, on your machine.
    pitfalls:
      - symptom: 'The fused column reads `nan`, and the script says `/odometry/filtered absent`.'
        cause: >-
          The fusion node is not running yet, or is still estimating the
          gyro's bias — it waits for the robot to be still before it
          publishes anything.
        fix: >-
          Start `make fused-odom` first and wait for its "estimating gyro
          bias" message to pass before running `make heading`.
      - symptom: The IMU topic exists, the bridge exists, and nothing ever arrives.
        cause: The world lacks Gazebo's IMU system plugin. The general sensors plugin drives only rendering sensors.
        fix: Add `gz-sim-imu-system` to the world.
      - symptom: The robot appears to jitter between two positions in RViz.
        cause: Two nodes publishing the same transform.
        fix: One owner per transform. The fusion node does not publish TF by default for exactly this reason.
    concepts:
      - term: Sensor fusion
        meaning: >-
          Combining sensors so each covers another's weakness — here, gyro
          heading with wheel distance.
      - term: Gyro bias
        meaning: >-
          A small constant offset a gyroscope reads at rest. Integrated, it
          becomes drift.
      - term: Per-leg error
        meaning: >-
          Error measured for each segment separately and in absolute value,
          so that opposite errors cannot cancel.
    quiz:
      - q: Why judge "stationary" from the wheels rather than the gyro?
        a: >-
          Using the gyro to decide when to recalibrate the gyro would absorb
          a real slow rotation into the bias estimate.
      - q: How did the wheels "beat" the gyro on the first metric?
        a: >-
          Net error over turns that netted to zero. Wheel error is
          proportional to rotation, so it cancelled across opposite turns.
    exercise:
      task: >-
        Design a path for which net heading error would make wheel odometry
        look *worse* than it is. What does that tell you about choosing a
        metric after seeing the data?
    read:
      - navigation.md

  - id: composing-robots
    title: Composing two robots into one
    minutes: 35
    objective: Put the arm on the base without editing either, and compute whether it can tip itself over.
    body: |
      Two descriptions become one. The arm keeps its file, the base keeps its
      file, and a third mounts one on the other. **Neither is modified**, and
      both still build and run alone — a test asserts it. This is what the
      spare mount frames from Stage 2 were for.

      Composition surfaces problems that a single robot hides. Every macro
      read its configuration from a property called `cfg`; with two robots
      in one document, whichever was assigned last would win, and the arm
      would be built from base numbers. Both descriptions also started their
      own controller manager — fine alone, wrong together. Both fixed without
      changing what either robot is.

      The detail that will catch you is **naming**. The arm's joints gain an
      `arm_` prefix, so `shoulder_pan_joint` becomes
      `arm_shoulder_pan_joint`. Controller names do not change, so every
      topic and action is the same as before. But any code that hardcoded a
      joint list now drives nothing — and fails *silently*, because a
      trajectory with unknown joint names is simply rejected. The fix was to
      ask the controller which joints it drives, rather than assume. That
      one change is why the same client later drove a foreign robot.

      Composition also changes physics. The arm is a large fraction of the
      total mass and it **moves**, so the centre of mass depends on the joint
      angles. Whether the robot can tip itself over is a question about the
      whole reachable workspace, carrying a payload — answered by a test that
      sweeps the joint limits against all four wheel contacts, with no
      simulator.

      It found that the binding edge is the **rear**, not the front: mounting
      the arm behind centre buys forward margin and spends it at the back.
      And its first answers were arithmetic on guessed masses. When real
      masses were computed from the CAD, the worst margin moved from 38.8 mm
      to 43.2 mm. Still nothing has been weighed.
    steps:
      - do: Start the composed robot.
        run: make mm-sim
      - do: In a second terminal, drive and move the arm at the same time.
        run: make mm-verify
        expect: '`ok` lines confirming one `/joint_states` with every joint, an arm goal accepted while the base was driving, and both moving.'
      - do: See the prefixed names the controller now drives.
        run: |
          make shell
          ros2 param get /arm_controller joints
      - do: Find the tipping test, and the margin it requires.
        run: grep -n -A20 "def test_the_robot_cannot_tip_itself_over" src/threevn_control/test/test_mobile_manipulator_kinematics.py
    checkpoint: >-
      The composed robot drives and moves its arm concurrently, and you can
      say which edge limits its stability and why.
    pitfalls:
      - symptom: Arm goals are rejected on the composed robot and work on the arm alone.
        cause: Hardcoded, unprefixed joint names.
        fix: Ask `/arm_controller` for its `joints` parameter, as the robot client does.
      - symptom: Two links with the same name, and no error.
        cause: Both components declared `imu_link`; the parser kept one.
        fix: Prefix the component; a test asserts both links survive.
    concepts:
      - term: Composition
        meaning: >-
          Building a robot from existing robot descriptions without modifying
          them — here, mounting the arm on the base.
      - term: Joint prefix
        meaning: >-
          A namespace applied to a component's joint names in a composed
          robot, so two components cannot collide.
      - term: Tipping margin
        meaning: >-
          How far inside the wheel contacts the centre of mass stays, across
          every reachable arm pose with a payload.
    quiz:
      - q: Why does the composed robot keep its controller names unprefixed while the joints change?
        a: >-
          So every topic and action stays the same as on the components — the
          interface clients depend on does not change.
      - q: Why sweep the whole workspace rather than check one pose for tipping?
        a: >-
          The arm moves, so the centre of mass moves. The worst case is
          wherever it is, not at the pose you happened to check.
    exercise:
      task: >-
        The long-reach composition has 94 mm more reach and 8.8 mm less
        margin. Find both numbers in `docs/mobile-manipulator.md`, then argue
        how much payload you would allow on it — and what you would need to
        weigh before you trusted your answer.
    read:
      - mobile-manipulator.md

  - id: solve-the-arm
    title: Solve the kinematics, and find out what the arm cannot do
    minutes: 40
    objective: Turn a position into joint angles exactly, and map the arm's real workspace.
    body: |
      Forward kinematics is multiplying transforms. The inverse — given a
      point, find the joint angles — has an exact closed form when the arm
      has the right structure, and this one does: a turntable carrying a
      planar three-link arm. Yaw comes from the target's bearing; the last
      link is subtracted using the requested tool angle; what remains is two
      links and the cosine rule. No solver, no iteration, nothing to
      converge.

      Two things here are worth more than the algebra.

      **The geometry is measured from the description**, not copied into the
      code: link lengths of 110, 95 and 70 mm, read by walking the chain.
      Change a length in the profile and the maths follows.

      **The solver checks the robot matches the structure it assumes, and
      refuses if not.** A closed form applied to the wrong arm does not fail
      — it returns confident, wrong angles. That guard later refused a real
      foreign arm with a true reason, which is the only way you ever find out
      a guard works.

      Verified against the running robot — commanded through the client,
      measured through TF, not checked against the arithmetic that produced
      it — positions land within 0.3 to 3.3 mm, and the spread is the
      controller settling, not the solver.

      Then it told us things nobody wanted to hear. **This arm cannot grasp
      from directly above anything on the surface it stands on.** The elbow
      bends essentially one way, −120° to +10°, so the only straight-down
      poses left are a thin ring 40–50 mm *below* its own base — inside the
      table. (This course first said "anywhere"; re-running the map for the
      lesson showed that was not quite true, so it now says what the
      measurement supports.) At table height, the reachable band is **250 to 270 mm**
      from the base — approached from the side, near full extension. And at
      the edge of its travel the arm **sags 6° short**, missing by 43 mm,
      because a heavy arm on hobby servos cannot hold itself at arm's
      length.

      None of that was visible before the kinematics existed. Solving the
      maths is what made the hardware's limits measurable instead of
      suspected — and it is cheaper to know them now than after building a
      perception stack that finds objects the arm cannot reach.
    steps:
      - do: Map where the gripper can be placed pointing straight down. No simulator needed.
        run: make workspace
        expect: >-
          Almost nothing: 1% of the reachable area, a single 200 mm ring
          40–50 mm *below* the arm's base — inside the table it stands on.
      - do: Now side-on.
        run: make workspace PITCH=90
        expect: '42% of the reachable area, from 70 to 270 mm out — this is the approach the arm can actually use.'
      - do: Read the structural guard.
        run: grep -n -A30 "def arm_geometry" src/threevn_control/threevn_control/kinematics.py
      - do: Find the test that pins the top-down finding, so widening the elbow later shows up as a change.
        run: grep -n -B2 -A12 "straight" src/threevn_control/test/test_inverse_kinematics.py
    checkpoint: >-
      You can state where the gripper can and cannot be placed, at which
      angles, and why.
    pitfalls:
      - symptom: The solver returns angles, and the arm goes somewhere else entirely.
        cause: A closed form applied to an arm whose structure it does not match.
        fix: Check structure before solving, and refuse — as `arm_geometry` does.
      - symptom: A pose at the edge of the workspace is consistently short.
        cause: The arm sagging under its own weight near a joint limit.
        fix: Prefer poses with the most joint margin, not the middle of the angle range.
    concepts:
      - term: Inverse kinematics (IK)
        meaning: >-
          Finding joint angles that place the tool at a target. Closed-form
          here, because of the arm's structure.
      - term: Workspace
        meaning: >-
          The set of positions — and orientations — the tool can actually
          reach.
      - term: Structural guard
        meaning: >-
          A check that the input matches the assumptions a method relies on,
          refusing rather than producing a confident wrong answer.
    quiz:
      - q: Why measure the link lengths from the description rather than reading them from the profile directly?
        a: >-
          The description is what runs. Measuring it means the solver uses the
          same geometry as TF and the simulator, with no second copy to drift.
      - q: Why is it valuable that the solver refuses arms it does not fit?
        a: >-
          A closed form on the wrong structure returns plausible, wrong
          angles. Refusing turns a silent error into a clear one.
    exercise:
      task: >-
        Using `make workspace` at different `PITCH` values, find the steepest
        approach angle that reaches anything at all, and where. Then propose
        the smallest change to one joint limit that would make top-down
        grasping possible — and name the test that would fail if you made it.
    read:
      - manipulation.md

  - id: prove-the-grasp
    title: Prove the grasp — and what is still open
    minutes: 40
    objective: Verify a grasp with two independent checks and a control, and report honestly when it fails.
    body: |
      Until this lesson, the robot had never picked anything up. The
      pick-and-place scenario was choreography, its named "pick" pose pointed
      the gripper upward and stopped 450 mm from the cube — and the cube in
      that world turned out to be 50 mm wide against a jaw that opens about
      45.7 mm, and fixed to the ground. It could never have been grasped.

      So the grasping world is built around what the last lesson measured: a
      35 mm cube that contact can move, on a 140 mm pedestal — because at
      floor level the arm is at full stretch and sags, while 230 mm out and
      80 mm up, 37 approach angles work and the tightest joint keeps 31° of
      margin. Put the object where the arm is strong.

      So the grasp is asked about in two separate ways, deliberately:

      - **`holding()` — what the robot believes**, from its own gripper
        position. A gripper commanded closed that stopped short is holding
        something. This is the check that still works on hardware.
      - **"lifted" — what actually happened**, from the simulator's ground
        truth: did the object rise? This is the check that cannot be fooled.

      Plus a **control**: the same motion at empty air. A detector that
      reports a grasp of nothing is not a detector.

      Reporting either check alone would have been wrong. The first version
      of `holding()` passed a grasp that had merely **shoved the cube 5 mm
      sideways**: a gripper that never closed sits at its open limit, which
      is also "not fully closed". It now requires the fingers to stop
      strictly *between* closed-on-air and open.

      Getting the jaws to the object exposed a geometric trap. The pinch
      point is **30 mm behind** the frame the solver places, so driving that
      frame to the object puts the object beyond the fingertips. And the
      offset depends on the approach angle, so the angle and the target have
      to be solved together — otherwise the commanded point is usually
      outside the workspace.

      **And here is where it stands: the grasp does not close on the
      cube.** The fingers shut to about a millimetre on a 35 mm cube that
      should be between them, meeting no resistance. The leading hypothesis
      is the mimic joint: the right finger follows the left in the
      description, but the simulator's control plugin may not enforce that
      coupling in physics, leaving one finger that does not push. The
      planned fallback is two independently driven fingers on one
      controller.

      Writing this lesson found two more things. The control had **never
      run**: its empty-air point was outside the workspace, the solver
      refused it, and the verifier counted a refused control as a pass. It
      now swings the cube's own position 35° about the arm's base, which is
      reachable by symmetry, and a control that cannot run is a failure.
      And once it ran, the gripper on the control stayed **fully open** —
      so `holding()` said no for the wrong reason, and the case the control
      exists for has still not been seen.

      This is the frontier of the project as you read it. The verifier
      exists so that "it works" will be a measurement when it does.
    steps:
      - do: Start the whole robot in the grasping world.
        run: make play WORLD=grasp_bench
      - do: In a second terminal, run the verifier.
        run: make grasp
        expect: >-
          Two attempts — the cube, and the empty-air control — each reporting
          where the fingers stopped, `holding=`, how far the cube rose, and
          `lifted=`. As this was written it ends `FAIL  the cube was not
          picked up`: the fingers closed to about 1 mm on the cube, and stayed
          fully open, at 18 mm, on the control.
      - do: Read why `holding()` has an upper bound as well as a lower one.
        run: grep -n -A25 "def holding" src/threevn_control/threevn_control/robot_client.py
      - do: Read why the pinch point is measured rather than assumed.
        run: grep -n -A18 "def pinch_offset" src/threevn_control/threevn_control/robot_client.py
    checkpoint: >-
      You ran the verifier, can read both verdicts and the control, and can
      state precisely what is and is not proven about grasping today.
    pitfalls:
      - symptom: The robot reports a confident grasp, and nothing came with it.
        cause: A check on the robot's belief alone — the fingers were blocked, or never closed.
        fix: Pair the belief with ground truth in simulation, and run a control at empty air.
      - symptom: The gripper reaches the object and pushes it away.
        cause: The commanded frame is not where the jaws pinch.
        fix: Measure the pinch offset through TF, and solve the approach angle and target together.
    concepts:
      - term: Belief versus ground truth
        meaning: >-
          What the robot can infer from its own sensors, versus what actually
          happened. On hardware only the first exists, so it must be checked
          against the second while the second is available.
      - term: Pinch point
        meaning: >-
          Where the gripper's jaws actually close — here 30 mm behind the
          frame the solver targets.
    quiz:
      - q: Why keep `holding()` at all, if the simulator can tell whether the cube was lifted?
        a: >-
          On hardware there is no simulator to ask. The robot will have to
          rely on its own belief, so that belief must be checked now, while
          ground truth is available to check it against.
      - q: What did the empty-air control protect against?
        a: >-
          A holding check that says yes to anything — which would make every
          real grasp look successful too.
    exercise:
      task: >-
        Write the experiment that would confirm or kill the mimic hypothesis:
        what you would command, what you would read from the simulator, and
        what result would mean the hypothesis is wrong.
      hint: >-
        If the right finger is not driven in physics, its simulated position
        will disagree with the position TF computes from the mimic rule while
        the gripper closes on something.
    read:
      - manipulation.md
      - gazebo.md

  - id: it-sees
    title: A camera, and the geometry behind it
    minutes: 40
    objective: Turn pixels into a position in metres, measure the error, and find its physical cause.
    body: |
      The camera frames were placed in Stage 2 and left dark — no sensor was
      emitted, so no test paid for rendering images it never read. Now the
      camera is on.

      **The detection is arithmetic, not a pipeline.** Everything that
      decides anything is a pure function over an image array, tested by 30
      tests that draw their own images and run in under a second. The ROS
      node is thin: subscribe, transform, publish. Perception is exactly
      where a swapped axis produces output that is plausible in every
      respect and wrong by 90°, and a detector you can only test by
      starting Gazebo is a detector nobody tests.

      Small decisions with real reasons: the target is **green**, because the
      robot is orange, which is close enough to red that a red target made the
      detector lock onto the arm — intermittently, the worst way to fail. The
      mask tests colour **dominance**, not brightness, because a rendered
      scene is full of highlights. And it takes the **largest connected
      blob**, because the centroid of every matching pixel puts two objects'
      answer on the empty floor between them.

      The image belongs to the **optical frame** from Stage 2. Naming the
      camera's body frame instead produces a pipeline that runs, at the right
      rate, with plausible numbers, and sends the arm to the wrong place.

      Then measure. Against the cube's known position: bearing is excellent,
      and range is **30 mm short**. The first explanation — that a cube seen
      at an angle shows two faces and looks wider — was wrong for this setup:
      the cube was dead ahead and showed one face. Sweeping the colour
      threshold settled it. The centroid did not move at all; the **width**
      did, because rendered edge pixels blend into the background and
      segmentation includes about 3 px of bleed per side. 74 px measured
      against 68 true is the entire shortfall. The pinhole arithmetic was
      right; its input was not.

      Hold on to the rejected explanation. In the machine-learning lesson,
      with the target moved around the workspace, it turns out to be real
      after all.
    steps:
      - do: Start the robot in the world with a target.
        run: make mm-sim WORLD=bench_with_target
      - do: In a second terminal, start the detector.
        run: make perception
      - do: In a third, measure it against ground truth.
        run: make perception-verify
        expect: Detected and true positions per axis, with the range axis about 30 mm short and the others close.
      - do: Read the colour tests that keep the detector off the robot itself.
        run: grep -n -B2 -A12 "livery\|own colour\|own color" src/threevn_perception/test/test_detector.py
    checkpoint: >-
      The detector reports a position, and you have its error per axis
      against ground truth — and can say which axis is biased and why.
    pitfalls:
      - symptom: Positions are plausible and the arm reaches 90° away from the object.
        cause: The image is labelled with the camera body frame instead of the optical frame.
        fix: The image and camera info belong to `camera_optical_frame`.
      - symptom: The detector occasionally locks onto the robot.
        cause: A target colour close to the robot's own.
        fix: Pick a target hue far from the robot's livery, and test against the robot's own colours.
    concepts:
      - term: Pinhole model
        meaning: >-
          The camera model mapping a 3D point to a pixel through focal length
          and principal point. Inverting it needs a known object size.
      - term: Intrinsics
        meaning: >-
          A camera's focal lengths and optical centre, published on
          `CameraInfo` — read from there rather than recomputed from config.
      - term: Edge bleed
        meaning: >-
          Boundary pixels blending object and background, inflating the
          segmented width by a few pixels at any distance.
    quiz:
      - q: Why is the first explanation for the 30 mm error worth keeping, after it was ruled out?
        a: >-
          It was wrong for that measurement and right elsewhere: off-axis, a
          cube's silhouette does widen, and across the workspace that
          dominates. Which mechanism dominates is a property of the data.
      - q: Why read intrinsics from `CameraInfo` rather than the robot profile?
        a: >-
          The profile says what the camera should be; `CameraInfo` says what
          it is. A test compares the two, which is how a change that never
          reached the simulator gets noticed.
    exercise:
      task: >-
        The edge bleed is a few pixels at any distance. Work out what that
        does to the *proportional* range error as the cube moves away, and
        whether the bias gets better or worse.
      answer: >-
        Worse. A constant few pixels is a growing fraction of a shrinking
        width, so the proportional range error grows with distance — a
        property the tests pin.
    read:
      - perception.md

  - id: datasets
    title: Datasets, splits, and the leak you did not look for
    minutes: 40
    objective: Build a dataset whose test set means something, and that can say where it came from.
    body: |
      The label is free: every frame is labelled with the target's position
      from simulator ground truth — exact and instant, where a real robot
      would need a motion-capture rig or a person drawing boxes. The cost is
      that everything learned from it is learned about a simulator, so every
      manifest says `labels.source: simulator`, and the validator rejects one
      that does not.

      **A dataset is a claim, not a folder.** Six months on, the question is
      never what is in the directory; it is "was this recorded before or
      after the camera was re-aimed?", and nothing in the pixels answers
      that. The manifest records the code, world, robot, camera and label
      source — and the first real recording had **no provenance at all**,
      because the container had no git repository to ask. The validator
      caught it.

      Two bugs the tooling found in its own data. **96 files, 8 pictures**:
      the recorder stopped at each pose and took twelve frames of a still
      robot through a noiseless camera, so every twelve were byte-identical,
      and every downstream number was twelve times too optimistic. A file
      count is not a sample count. Then the fix — record while moving —
      introduced a worse bug: the image and its label came from **different
      instants**, 40 mm apart at driving speed. The recorder now steps,
      pauses, and shoots.

      **Split by episode, never by frame.** A robot dataset is a time series.
      Consecutive frames are near-duplicates, so a random split puts
      near-copies of training frames in the test set:

      | split | test frames within 10 mm of a training frame |
      |---|---|
      | by episode | 0 of 12 |
      | by frame | **12 of 15** |

      And the leak you did not look for. The leakage check compared label
      distances, and it worked — until the dataset grew, label space became
      dense, and the correct and leaking splits scored the same. It was
      silently passing. Comparing the **images** directly found exact
      duplicates across the frame-wise split — and found that even the
      episode split is not far behind, because a flat grey floor with one
      small cube genuinely looks alike from episode to episode. The honest
      split was honest; the scene was simply easy to memorise.
    steps:
      - do: Start the robot in the target world.
        run: make mm-sim WORLD=bench_with_target
      - do: Record a dataset. Forty episodes takes about 25 minutes; eight is enough to see the pipeline.
        run: make dataset EPISODES=40
      - do: Describe it — sizes, distinct frames, provenance, and both splits side by side.
        run: make dataset-describe
        expect: A distinct-frame count, the manifest's provenance, and the leakage comparison between episode and frame splits.
    checkpoint: >-
      The dataset has a manifest tying it to a commit, its distinct-frame
      count equals its file count, and its split is by episode.
    pitfalls:
      - symptom: A recording keeps a fraction of its frames, rejecting the rest as "behind the camera".
        cause: A simulator degraded by earlier runs.
        fix: Record against a freshly started simulator. The rejection accounting is what tells you.
      - symptom: The split refuses to run.
        cause: Fewer than three episodes.
        fix: Record more. It refuses rather than falling back to a frame split, which would hide the problem.
    concepts:
      - term: Episode
        meaning: >-
          One continuous recording run. Frames within an episode are
          correlated; the unit of splitting.
      - term: Data leakage
        meaning: >-
          Test data that is effectively in the training set, so scores
          overstate how the model will do on new data.
      - term: Dataset manifest
        meaning: >-
          A record of what produced a dataset — code, world, robot, camera,
          label source — so it can be traced and trusted later.
    quiz:
      - q: Why is a random frame split wrong for robot data?
        a: >-
          Consecutive frames are near-duplicates. A random split puts near-
          copies of training frames in the test set, inflating scores.
      - q: The label-distance leakage check passed both splits equally. What had happened?
        a: >-
          Label space became dense as the dataset grew, so the metric could no
          longer tell the leaking split from the correct one. It had stopped
          discriminating.
    exercise:
      task: >-
        Run `make dataset-describe` on an eight-episode recording and on a
        forty-episode one. Which numbers change in the direction you
        expected, and which do not?
    read:
      - data-pipeline.md

  - id: beats-geometry
    title: When a model beats geometry, and why
    minutes: 40
    objective: Fit a model, prove it beats the closed form honestly, and find out why it wins.
    body: |
      The task already has a closed-form solution, which is what makes this
      honest. The baseline is evaluated **in the same run, on the same test
      set, by the same function** as the model. "The model beat the
      geometry" is not a claim until both numbers come out of one place.

      | | test median error |
      |---|---|
      | closed form | 106.8 mm |
      | fitted, geometry features | 46.5 mm |
      | fitted, **+ shape features** | **10.5 mm** |

      The baseline reads 106.8 mm here against 30 mm in the perception
      lesson — same code, same camera, but a whole workspace instead of one
      favourable spot.

      The model is linear and solved in closed form: no epochs, no learning
      rate, nothing to tune into looking good. That is a choice with a
      reason. The deprojection maths is linear in the right features, so a
      linear model can reproduce the geometry exactly *and* fit what the
      geometry takes as given. A neural network could at best rediscover
      that, with capacity to memorise 480 samples. With raw pixels the
      answer would differ — and so would the amount of data needed.

      The interesting part is **why** it wins, and it was measured before
      the model was written. The closed form assumes the cube's width is
      50 mm. The width the images actually imply ranges from 55 to 78 mm —
      bracketing one face up to the diagonal of two. **Off-axis, the cube's
      silhouette widens** — the very explanation the perception lesson
      rejected for a centred cube. Both were right; which mechanism dominates
      is a property of the data. Nothing in the geometric features says
      which way the cube faces, so the fix was a hypothesis: give the model
      the blob's *shape*, which carries the viewing angle. The ablation
      tested it, and error fell from 46.5 to 10.5 mm.

      Then the honest caveats. The test set is optimistic — those episodes
      look alike. The median hides a tail: test p95 is 74.8 mm. And test
      scored *better* than train, which on 71 test frames is variance, not
      skill.
    steps:
      - do: With a forty-episode dataset recorded, fit and evaluate.
        run: make train
        expect: The closed form, geometry-only and with-shape errors from one run, on one test set.
      - do: Find where the artefact records its feature names, in order.
        run: python3 -c "import json; m = json.load(open('datasets/target/model.json')); print(m.get('features') or list(m)[:12])"
    checkpoint: >-
      The model and the geometric baseline are scored in the same run, on
      the same test set, by the same function — and you can explain the
      ablation.
    pitfalls:
      - symptom: A single coefficient implies a physical quantity that seems wrong.
        cause: Correlated features — they all share one term — so the split of the mapping between them is not unique.
        fix: Do not read coefficients as physics here. Trust the direct measurement of implied width instead.
      - symptom: The model beats the baseline by a mile on your first run.
        cause: Possibly a leaking split, or a baseline scored differently.
        fix: Score both in one run, on one split, by one function, split by episode.
    concepts:
      - term: Baseline
        meaning: >-
          The simplest credible solution, scored identically, that a model
          must beat to earn its place — here, the closed-form geometry.
      - term: Ablation
        meaning: >-
          Removing or adding one group of features and re-scoring, to test
          which part of a model is responsible for its performance.
      - term: Feature contract
        meaning: >-
          The exact names and order of a model's inputs. Serve them in a
          different order and you get numbers, not an error.
    quiz:
      - q: Why fit a linear model in closed form rather than train a network?
        a: >-
          The mapping is known to be linear in the right features. A network
          could at best rediscover it while having capacity to memorise a few
          hundred samples, and an iterative fit adds settings that can be
          tuned into looking good.
      - q: The model beat the geometry. Was it cleverer?
        a: >-
          No. It was given the one thing the geometry was missing — the
          viewing angle, carried by the blob's shape.
    exercise:
      task: >-
        Record a second dataset with only eight episodes, train on it, and
        compare its test p95 to the forty-episode model's. Which number
        moved most, and what does that say about reporting medians?
    read:
      - machine-learning.md

  - id: mlops
    title: Shipping a model like software
    minutes: 35
    objective: Register, gate, promote and roll back a model.
    body: |
      A model is not a file. It is a file, the data that produced it, the
      metrics that justify it, and a contract with the code that runs it. The
      registry stores all four and refuses anything missing one.

      It is a directory and one pointer — no database, no service. Versions
      are **content-addressed** and **immutable**: a counter is state that can
      disagree with the files; a hash cannot. Production is a **pointer**, so
      promotion and rollback are the same operation, and rollback is as well
      tested as promotion. History is **append-only**, because "what was
      running last Tuesday?" is the first question after a failure.

      **Refusing is the feature.** Every promotion runs five gates and reports
      *all* failures, not the first:

      | gate | without it |
      |---|---|
      | validates | a model without metrics cannot be compared with anything |
      | provenance | a robot running an untraceable model cannot be explained |
      | feature contract | features served in a different order still produce numbers |
      | beats baseline | worse than code needing no data and no training |
      | no regression | the model in production is the thing to beat now |

      Demonstrated, not asserted: a deliberately degraded model was
      registered and refused by the last gate, at 95.0 mm against production's
      10.5 mm. The regression gate is a **tolerance**, 5%, not a wall — a gate
      that forbids every trade-off gets bypassed routinely, and then means
      nothing for the cases that matter. Forcing a promotion is possible, and
      is recorded *as forced*, because a log that omits that every gate
      objected has lost its most useful fact.

      Rollback is a pointer move. That is the entire reason for the
      indirection, and it is the same reason your deployments are symlinks
      rather than copies.
    steps:
      - do: Register the model you trained.
        run: make registry-register
        expect: A short content hash as its version. Registering the same bytes again returns the same version.
      - do: Promote it, and read every gate's verdict.
        run: make registry-promote
        expect: 'Five `ok` lines, then `promoted (previous: nothing)`.'
      - do: Try to roll it back.
        run: make registry-rollback
        expect: >-
          A refusal: the current model is the first ever promoted, so there
          is nothing to roll back to — "a step forward with no undo, which is
          worth knowing before rather than after".
      - do: >-
          Make a worse model on purpose, by over-regularising it, register
          it, and try to promote it.
        run: |
          make train ALPHA=10
          make registry-register
          make registry-promote
        expect: '`FAIL  no_regression` — a test median around 47 mm against production''s 10.5 — and `NOT promoted`.'
      - do: >-
          Force it through with a reason, so there is something to roll back
          from. Use the version the last register printed.
        run: make registry-promote VERSION=<that-version> FORCE=1 REASON="rehearsing a rollback"
        expect: '`FORCED past failing gates`.'
      - do: Roll back, and read the history.
        run: |
          make registry-rollback
          make registry-status
        expect: Production back on the good model, and the forced promotion recorded as `FORCED` in the history.
    checkpoint: >-
      Production points at a specific immutable version, a worse model was
      refused by name, and one command moved production back after a forced
      promotion — with all of it in the history.
    pitfalls:
      - symptom: The registry reports a model's error as a different, worse number.
        cause: >-
          Which metrics entry belongs to the stored model was decided in three
          places, two of which took the alphabetically last key — and `+`
          sorts before `g`.
        fix: The artefact names its selected entry, and one function answers the question for everyone.
    concepts:
      - term: Model registry
        meaning: >-
          Versioned storage for models with their data, metrics and
          contract, plus a production pointer.
      - term: Content-addressed version
        meaning: >-
          A version identifier computed from the artefact's bytes, so the same
          content always gets the same id and different content never does.
      - term: Promotion gate
        meaning: >-
          A check a model must pass before production points at it.
    quiz:
      - q: Why report every failed gate, not just the first?
        a: >-
          A model failing three checks should be fixed once, not three times
          — each discovered only after another training run.
      - q: Why is the regression gate a 5% tolerance rather than a hard rule?
        a: >-
          A gate that forbids every trade-off gets bypassed routinely, which
          strips it of meaning for the cases it exists to stop.
    exercise:
      task: >-
        Train a model from a shell inside the container with
        `ros2 run threevn_ml train`, rather than with `make train`, register
        it and try to promote it. Which gate refuses, and why is that the
        right gate to refuse?
      answer: >-
        `provenance` — "no commit recorded for the training run". The
        container has no git repository; `make train` passes the commit in.
        A model nobody can trace to the code that produced it cannot be
        explained after an incident, however good its numbers are.
    read:
      - mlops.md

  - id: serve-and-watch
    title: Serving, and noticing the question changed
    minutes: 35
    objective: Serve whichever model is promoted, compare it live with the physics, and detect drift.
    body: |
      Serving knows nothing about which model it runs. It loads whatever the
      registry points at, so swapping models is a promotion and a restart —
      never an edit. What changes between a good deployment and a bad one is
      data in a directory, not code nobody reviewed.

      It **refuses to start** when nothing is promoted, rather than picking a
      file — picking one is exactly the untracked deployment the registry
      exists to prevent. It refuses on a feature-contract mismatch, too,
      turning a subtle wrongness into a loud failure before anything moves.

      **It publishes what the physics would have said.** The model's estimate
      goes out on one topic; the closed-form estimate goes out on another,
      costing one multiplication. On a robot there is no ground truth, so a
      model drifting away from the physics is otherwise invisible until
      something misses. Live, the two differed by 28 mm — and the model was
      the one closer to the truth. That gap is the correction it learned,
      visible at runtime.

      A model has no way to say *I have never seen anything like this.* It
      returns a number for anything, with the same confidence. So a monitor
      compares live features with the training distribution recorded in the
      artefact, and **names the feature** that is out of range: "something is
      unusual" sends someone looking; "1/w is nine sigma out" says the target
      is a size the model never saw. It cannot say the answer is wrong. Only
      that the question changed — which is when a wrong answer becomes
      likely.

      It is deliberately simple, and deliberately does not act. An untuned
      detector that fires constantly gets switched off, taking the real
      alarms with it. And a robot that rolls back its own model without a
      human can oscillate between two models in a loop.
    steps:
      - do: Start the robot in the target world, then the server in a second terminal.
        run: |
          make mm-sim WORLD=bench_with_target
          make serve
        expect: A banner naming the production version and its error; refusal if nothing is promoted.
      - do: In a third terminal, compare the model with the physics, live.
        run: |
          make shell
          ros2 topic echo /ml/target_pose --once
          ros2 topic echo /ml/target_pose_geometric --once
      - do: >-
          Stop the server, and look at what it says about the model it would
          serve. Then promote a different version, start it again, and
          confirm the banner changed — with no code edited in between.
    checkpoint: >-
      The server runs only what the registry points at, and you have read
      the model's estimate and the geometric one side by side.
    pitfalls:
      - symptom: The server will not start.
        cause: Nothing is promoted, or the feature contract does not match the serving code.
        fix: Promote a model that passes the gates. Do not point the server at a file.
    concepts:
      - term: Shadow baseline
        meaning: >-
          Publishing a simple reference answer alongside the model's, so their
          divergence is visible where there is no ground truth.
      - term: Data drift
        meaning: >-
          Live inputs moving away from what the model was trained on. Makes a
          wrong answer likely, without saying the answer is wrong.
    quiz:
      - q: Why must serving refuse to start rather than pick the newest model file?
        a: >-
          Picking a file is an untracked deployment — exactly what the registry
          exists to prevent. Refusal keeps every running model traceable.
      - q: Why does the drift monitor report rather than roll back?
        a: >-
          It cannot say the answer is wrong, only that the question changed.
          And automatic rollback without a human can oscillate between models.
    exercise:
      task: >-
        Propose one way to make the drift monitor fire in this simulation —
        a change to the world that moves a feature outside its training range
        — and predict which feature it will name.
    read:
      - mlops.md

  - id: somebody-elses-robot
    title: Somebody else's robot
    minutes: 35
    objective: Run the whole stack against a robot nobody here designed, and find the assumption that breaks.
    body: |
      Every earlier test of the central claim swapped the execution *target*
      — mock, Gazebo, ESP32 — under one robot this project designed. That is
      the easy half. This swaps the **robot**.

      The SO-101 is an open arm by another team: five joints and a jaw, bus
      servos with real position feedback, Apache-2.0. It was deliberately
      *not* re-authored into a profile here — that would have tested this
      project's xacro rather than its stack. Its description is used exactly
      as it ships, fetched on demand and never committed. The launch file
      adds only what Gazebo needs: a control block naming its joints with the
      same simulator plugin, and an anchor to the world, because a free
      632 g arm topples the moment a joint moves.

      It spawned, every controller came up, and the client — unchanged —
      discovered its five joint names from the controller, read its state and
      limits, resolved its transforms, **moved it**, and opened its jaw.

      **One constant broke.** The named poses — `home`, `ready` and the rest —
      are a dictionary of four-element lists in the client. A five-joint arm
      cannot take a four-joint pose, and every scenario starts with `home()`,
      so every scenario stops there. Joint names had been made discoverable;
      the poses those joints are sent to had not. The fix is to move named
      poses into the robot profile, where every other physical fact about a
      robot already lives.

      The other result is a refusal. The inverse-kinematics guard would not
      solve the SO-101, and said exactly why: five driven joints where its
      closed form needs four, and a shoulder that turns about a different
      axis. Refusing with a true reason, on a real foreign arm, is worth more
      than the guard passing on our own.

      What the spike does **not** say is "adopt it". It would fix this arm's
      worst limit — its elbow is symmetric, where ours bends one way — and it
      has feedback our servos lack. It also costs about $122 against our
      roughly $30 arm. That is a product decision, and it would have to be
      reflected honestly in the bill of materials if it were taken.
    steps:
      - do: Fetch the foreign description, once. It lands in a gitignored directory with a NOTICE.
        run: make so101-fetch
      - do: Spawn it under this project's controllers.
        run: make so101
      - do: In a second terminal, ask what the controller drives.
        run: |
          make shell
          ros2 control list_controllers
          ros2 param get /arm_controller joints
        expect: Five joint names nobody here chose.
      - do: Run the simplest scenario, and read the failure.
        run: make scenario NAME=home
        expect: A failure about joint counts — `expected 5 joint positions, got 4`.
    checkpoint: >-
      The foreign arm runs under these controllers, and you can name the
      single constant that stops the scenarios and where it should live
      instead.
    pitfalls:
      - symptom: '`make so101` fails because the description is missing.'
        cause: It is fetched on demand, not committed.
        fix: '`make so101-fetch` first.'
      - symptom: The arm collapses as soon as it moves.
        cause: The upstream description has no world anchor.
        fix: The launch file adds one. If you write your own, add a fixed joint to `world`.
    concepts:
      - term: Spike
        meaning: >-
          A short, deliberately limited experiment to answer one question —
          here, whether the seam holds for a robot designed elsewhere.
      - term: Hidden assumption
        meaning: >-
          A fact about one robot baked into code that looks general — here,
          the number of joints in a named pose.
    quiz:
      - q: Why use the foreign description exactly as shipped, instead of converting it into a 3VN profile?
        a: >-
          Converting it would test this project's description tooling, not
          whether the stack above the seam generalises.
      - q: The guard refused to solve the SO-101. Is that a failure of the spike?
        a: >-
          No. A closed form on the wrong structure returns wrong angles
          silently. Refusing with a correct reason, on a real foreign arm, is
          the guard working.
    exercise:
      task: >-
        Sketch the change that moves named poses into the profile: the YAML
        shape, how the client would read it, and the test that would have
        caught the four-element assumption before the spike did.
    read:
      - so101-spike.md
      - manipulation.md

project:
  title: Close the loop
  minutes: 150
  brief: |
    Take the learned perception from nothing to production and back:
    record, train, register, gate, promote, serve, break, and roll back.
    Every step leaves evidence, and the project is done when the evidence
    would convince someone who did not watch you do it.
  tasks:
    - do: Record a dataset of forty episodes against a freshly started simulator, and describe it.
      run: |
        make mm-sim WORLD=bench_with_target
        make dataset EPISODES=40
        make dataset-describe
    - do: Train, and keep the printed comparison against the closed form.
      run: make train
    - do: Register and promote it. Keep the gate report.
      run: |
        make registry-register
        make registry-promote
    - do: Serve it, and record one live pair of model and geometric estimates.
      run: make serve
    - do: >-
        Produce a worse model on purpose, register it, and try to promote it.
        Keep whatever the gates said.
      run: |
        make train ALPHA=10
        make registry-register
        make registry-promote
    - do: >-
        Force it through with a reason, restart the server and note what it
        now serves — then roll back, and show production pointing where it did
        before.
      run: |
        make registry-promote VERSION=<the-worse-version> FORCE=1 REASON="rollback rehearsal"
        make registry-rollback
        make registry-status
    - do: >-
        Write a half-page report: the dataset's provenance, the model's error
        against the baseline with its tail, what the gates did with the worse
        model, and one thing you would not yet trust about any of it.
  done_when:
    - The dataset manifest names the commit that recorded it, and its split is by episode.
    - Model and baseline errors come from one run, and the report quotes a tail figure, not just a median.
    - The worse model was refused by a named gate, and its forced promotion is in the history marked `FORCED`.
    - Production was rolled back with one command, and the status shows it.
    - The report names at least one thing that is not proven.
  hints:
    - title: The recording is slow
      body: >-
        Forty episodes takes about 25 minutes. Start it, and read the
        machine-learning doc while it runs. Do not reuse a simulator that has
        been driven around for an hour — restart it first.
  read:
    - data-pipeline.md
    - machine-learning.md
    - mlops.md
