id: describing
number: 2
kind: stage
title: Describing a robot
price: free
summary: >-
  Write down what the robot physically is — once — in a form that the
  simulator, the tests and the hardware all read, and that a test can
  check before anything moves.

outcomes:
  - Read a robot description as a tree of links and joints, and predict how each joint moves before you move it.
  - Change a robot's dimensions by editing data, never a model file, and watch every consumer follow.
  - Explain why inertia is computed rather than typed, and what a wrong tensor does to a physics engine.
  - Place the frames later stages depend on, and read any transform between them on a live robot.
  - Test a description with two independent parsers, and derive joint limits from a datasheet rather than a guess.
  - Make a description lie on purpose, and name the test that catches each lie.

prerequisites:
  - Stage 1 complete — `make setup` and `make test` both pass.

lessons:
  - id: links-and-joints
    title: A robot is a tree
    tags: [ros2]
    minutes: 30
    flavors:
      so101:
        note: >-
          the tables above are the 3VN arm's. The SO-101 has five revolute
          arm joints, `shoulder_pan`, `shoulder_lift`, `elbow_flex`,
          `wrist_flex` and `wrist_roll`, and a `gripper` that is revolute
          too: one jaw swings against a fixed one, so its positions are
          radians, not millimetres, and there is no mimic joint. Its root is
          `world`, which upstream's file does not have. This project adds it
          because an unclamped 632 g arm topples the first time a joint
          moves, and a real SO-101 is clamped to a bench.
        steps:
          - do: Print the expanded description and look at its shape.
            run: make urdf PROFILE=so101_follower 2>/dev/null | head -80
            expect: >-
              `world`, the fixed joint that clamps `base_link` to it, then
              `<link>` blocks whose visuals are upstream's meshes and whose
              collisions are plain boxes.
          - do: List every joint and its type.
            run: make urdf PROFILE=so101_follower 2>/dev/null | grep '<joint name=.*type='
            expect: >-
              Six `revolute` joints and two `fixed` ones:
              `world_to_base_link`, and `gripper_frame_joint` for the tool
              frame.
          - do: Read every joint's axis.
            run: make urdf PROFILE=so101_follower 2>/dev/null | grep '<axis'
            expect: >-
              `0 0 1` for all six moving joints, and `0 0 0` for the fixed
              one. They do not all turn the same way: an axis is written in
              the joint's own frame, and each joint's `<origin rpy=...>`
              rotates that frame first.
          - do: Read the limits, in radians.
            run: make urdf PROFILE=so101_follower 2>/dev/null | grep -B6 '<limit' | grep -E 'joint name|<limit'
            expect: >-
              From the jaw back to the base: `gripper` −0.17 to 1.75 (−10° to
              +100°), `wrist_roll` −2.74 to 2.84, `wrist_flex` ±1.66,
              `elbow_flex` ±1.69, `shoulder_lift` ±1.75, `shoulder_pan`
              ±1.92.
          - do: >-
              Look at it. Start the viewer, then open
              **http://localhost:8106/vnc.html** in a browser.
            run: make view PROFILE=so101_follower
            expect: RViz with upstream's meshes, and a window of six joint sliders.
          - do: >-
              Before dragging each slider, predict which way the arm will
              move. Then drag it. Start with `shoulder_pan`: does a positive
              value swing the arm to its left or to its right?
            expect: >-
              Positive `shoulder_pan` swings it to its right, toward negative
              y. That joint's origin is rotated half a turn, so its `0 0 1`
              axis points down. Every slider stops at its limit.
        checkpoint: >-
          You can name each of the SO-101's joints with its type and range,
          and predict which way it moves before you drag its slider.
        pitfalls:
          - symptom: The browser page stays on "Connecting" or is blank.
            cause: The container is not running, or another process holds port 8106.
            fix: >-
              `make up`, then check the port with
              `lsof -nP -iTCP:8106 -sTCP:LISTEN`.
          - symptom: '`make urdf PROFILE=so101_follower` prints nothing, or fails on a missing `so101.urdf`.'
            cause: The upstream description has not been fetched. It is not committed to this repository.
            fix: Run `make so101-fetch` once.
        quiz:
          - q: Every moving joint's axis is `0 0 1`. How can they turn in different directions?
            a: >-
              The axis is expressed in the joint's own frame, and the
              joint's origin rotates that frame relative to the parent
              link. The direction of motion is the axis and the origin
              together; neither alone tells you.
          - q: The SO-101's gripper has one actuated joint and no mimic. Why does it not need one?
            a: >-
              Only one jaw moves. It swings against a jaw that is part of the
              gripper link, so there is no second part to copy the first.
          - q: Why does this project add a `world` link that the upstream file does not have?
            a: >-
              Without it `base_link` is a free body, and a simulated arm with
              nothing holding it down topples as soon as a joint moves. The
              fixed joint is the bench clamp.
        exercise:
          task: >-
            From the `make urdf PROFILE=so101_follower` output alone, sketch
            the chain from `world` to `gripper_frame_link`. Then check it
            against the running robot: with `make view PROFILE=so101_follower`
            up, open `make shell` and run
            `ros2 run tf2_ros tf2_echo base_link gripper_frame_link`. Move
            `shoulder_lift` and watch the numbers change.
        read:
          - hardware.md
          - ros2.md
          - so101.md
    objective: Read a robot description as links and joints, and predict how each joint moves.
    body: |
      A robot description — URDF, the Unified Robot Description Format — is
      a **tree**. Each node is a *link*: a rigid body with a shape you see, a
      shape that collides, and a mass. Each edge is a *joint*: how a child
      link moves relative to its parent. If you have built a scene graph or
      nested coordinate transforms, you already have the model; a joint is a
      transform with one variable in it.

      Four joint types cover nearly everything:

      | type | moves | here |
      |---|---|---|
      | revolute | rotates, between limits | the four arm joints |
      | continuous | rotates forever | the wheels, in the *Put it on wheels* side track |
      | prismatic | slides, between limits | the gripper fingers |
      | fixed | not at all | reference frames like `tool0` |

      This arm is four rotating joints and a gripper:

      | joint | axis | range |
      |---|---|---|
      | `shoulder_pan` | Z (vertical) | −90° … +90° |
      | `shoulder_lift` | Y | −15° … +120° |
      | `elbow` | Y | −120° … +10° |
      | `wrist` | Y | −90° … +90° |
      | gripper | slides | 0 … 18 mm |

      The asymmetric ranges are deliberate: the arm cannot fold back through
      its own base. Remember the elbow's range in particular — in Tier 6 it
      turns out to decide what this arm can and cannot pick up.

      Two fingers, one motor: the right finger *mimics* the left, which is
      what a single-servo gripper physically does. And "tree" is a real
      constraint, not a metaphor. A description has exactly one root and no
      loops — which is why a parallel linkage, a mechanism with a closed
      loop in it, cannot be described directly. That fact comes back to
      decide a design in the *Make your own robot* side track.
    steps:
      - do: Print the expanded description and look at its shape.
        run: make urdf | head -80
        expect: '`<link>` blocks with `<visual>`, `<collision>` and `<inertial>`, and `<joint>` blocks naming a parent and a child.'
      - do: List every joint and its type.
        run: make urdf | grep '<joint name=.*type='
        expect: Four `revolute`, two `prismatic`, and ten `fixed` joints for the reference frames and mounts.
      - do: >-
          Look at it. Start the viewer, then open
          **http://localhost:8106/vnc.html** in a browser.
        run: make view
        expect: RViz with the arm, and a window of joint sliders.
      - do: >-
          Before dragging each slider, predict which way the arm will move.
          Then drag it. Try to push `elbow` past +10°.
        expect: The slider stops at the limit. There is no slider for the right finger.
    checkpoint: >-
      You can name each joint's type and range, and predict the direction of
      motion before you drag its slider.
    pitfalls:
      - symptom: The browser page stays on "Connecting" or is blank.
        cause: The container is not running, or another process holds port 8106.
        fix: >-
          `make up`, then check the port with
          `lsof -nP -iTCP:8106 -sTCP:LISTEN`.
      - symptom: There is no slider for the right gripper finger, and it looks broken.
        cause: It is a mimic joint. It has no input of its own; it follows the left finger.
        fix: Nothing to fix. Move the left finger slider and watch both.
    concepts:
      - term: URDF
        meaning: >-
          Unified Robot Description Format — the XML tree of links and
          joints that every ROS tool reads to know what the robot is.
      - term: Link
        meaning: >-
          A rigid body in a robot description, with a visual shape, a
          collision shape and an inertial (mass) block.
      - term: Joint
        meaning: >-
          The connection between a parent and a child link, with a type —
          revolute, continuous, prismatic or fixed — an axis and limits.
      - term: Mimic joint
        meaning: >-
          A joint that copies another's position, scaled and offset. How one
          servo drives two gripper fingers.
      - term: Degrees of freedom (DOF)
        meaning: >-
          The number of independent ways a robot can move. This arm has four,
          plus a gripper.
    quiz:
      - q: Why is a wheel a continuous joint rather than a revolute one with a very large limit?
        a: >-
          A wheel has no travel limit. Give it one and the controller fights
          the limit after a few metres, and the base slows to a stop for no
          visible reason.
      - q: The gripper has two fingers and one actuated joint. How?
        a: >-
          The right finger is a mimic of the left. One servo drives one
          joint; the description says the other follows.
      - q: Why can a URDF not describe a parallel linkage directly?
        a: >-
          A URDF is a tree — one parent per link, no loops. A linkage is a
          closed chain, so some link would need two parents.
    exercise:
      task: >-
        From the `make urdf` output alone, sketch the chain from
        `base_footprint` to `grasp_frame`. Then check it against the running
        robot: with `make view` up, open `make shell` and run
        `ros2 run tf2_ros tf2_echo base_link grasp_frame`. Move
        `shoulder_lift` and watch the numbers change.
    read:
      - hardware.md
      - ros2.md

  - id: one-source-of-truth
    title: One source of physical truth
    tags: [ros2, architecture]
    builds_on: [links-and-joints]
    minutes: 35
    flavors:
      so101:
        note: >-
          the rule turns round. The 3VN arm's profile is its single source
          of physical truth and its URDF is generated from it. The SO-101's
          kinematic truth is upstream's URDF, fetched unmodified and pinned
          to one commit, and `so101_follower.yaml` is an overlay: it adds
          only what a URDF has no place for, such as which joints are the
          arm, named poses, servo figures and the hardware target. It
          restates no link length, origin or axis, because a second copy
          could disagree with the first and nothing would say which was
          right. The principle is the same: every number has exactly one
          home.
        steps:
          - do: >-
              Open the overlay and find three things: the list of arm
              joints, a named pose, and a `provenance` line. Then look for a
              link length, and notice there is none.
            run: less src/threevn_robot_description/config/so101_follower.yaml
          - do: Read the test that keeps it that way.
            run: grep -n -A15 "def test_it_restates_no_kinematics" src/threevn_robot_description/test/test_so101_profile.py
            expect: >-
              Each joint entry may say which servo drives it, its bus id and
              its calibration, and nothing else. Geometry and limits belong
              to upstream.
          - do: Compare upstream's joint origins with the ones that actually run.
            run: |
              diff -w <(grep -A1 'type="revolute"' vendor/so101/so101.urdf | grep "<origin") \
                      <(make urdf PROFILE=so101_follower 2>/dev/null | grep -A1 'type="revolute"' | grep "<origin")
              echo "exit status: $?"
            expect: >-
              No differences and `exit status: 0`. The overlay never moves a
              joint.
          - do: Now compare the limits.
            run: |
              diff -w <(grep "<limit" vendor/so101/so101.urdf) \
                      <(make urdf PROFILE=so101_follower 2>/dev/null | grep "<limit")
            expect: >-
              Six changed lines, and only `effort` and `velocity` differ.
              Every `lower` and `upper` is upstream's, untouched. Upstream
              says how far a joint may go; this project says how hard and how
              fast its servo can drive it. A later lesson in this stage is
              about where those two numbers come from.
        checkpoint: >-
          You can point to where each kind of number about the SO-101 lives,
          upstream or overlay, and show from the diffs that the overlay
          changes what the motors can do and never where the joints are.
        pitfalls:
          - symptom: You edited `vendor/so101/so101.urdf` and the change vanished.
            cause: >-
              `vendor/` is fetched, not committed, and `make so101-fetch`
              overwrites it. A test also checks that the overlay never
              modifies the upstream file.
            fix: >-
              Put the change in the overlay if it is something a URDF has no
              place for. If it is geometry, it belongs upstream: take a newer
              pinned commit rather than editing a local copy.
          - symptom: '`PROFILE=` names a new file you just created, and it is not found.'
            cause: A new file has no installed symlink until the workspace is rebuilt.
            fix: Run `make build` once after adding a profile.
        quiz:
          - q: Why does the SO-101's profile not simply copy upstream's link lengths, so that everything is in one file?
            a: >-
              Then there would be two copies of the same geometry, upstream's
              and ours, and a newer upstream commit could change one without
              the other. Nothing would say which was right.
          - q: The overlay changes `effort` and `velocity` but never `lower` and `upper`. Why that split?
            a: >-
              Where a joint stops is a fact about the printed parts, which
              upstream designed. How hard and how fast it can be driven is a
              fact about the servos and the supply, which upstream left as
              placeholders.
        exercise:
          task: >-
            Read `scripts/fetch_so101.sh` and its comment on pinning. Suppose
            upstream renames `elbow_flex` to `elbow` tomorrow. List
            everything in this repository that would break if the fetch
            followed upstream's `main`, and say which test would tell you
            first now that it is pinned.
        read:
          - decisions/0005-yaml-single-source.md
          - so101.md
    objective: Change a robot's dimensions without editing any model file.
    body: |
      The usual way to write a robot description is to type numbers into
      XML. The usual result is the same number in four places, three of them
      stale.

      So the numbers live in YAML and the XML reads them. xacro — the macro
      language robot descriptions are written in — can load a YAML file
      directly, and the only argument the description takes is that file's
      path. A different arm is a different file, not an edit. The long-reach
      profile exists purely to prove it: it shares every line of xacro with
      the default and differs only in numbers.

      The rejected alternatives are worth knowing, because both look
      reasonable. A script that generates a URDF and commits it creates a
      second artefact that drifts — and someone will eventually edit the
      generated file, making every consistency test meaningless. Sixty
      separate macro arguments, one per number, would not survive the
      mobile base.

      Units live in key names. Joint limits are stored as `lower_deg`,
      because servo datasheets and humans both work in degrees; the
      conversion to radians happens inside xacro. That is deliberate: it
      means the test comparing the generated model to the YAML is a real
      test, because the value crosses a conversion on the way.

      And every mass carries a `provenance` field — `measured`,
      `datasheet`, `estimated` or `computed`. A test requires it. For most
      of this project every mass was `estimated`, a guess, and the field
      made that visible in the data rather than implied by a comment. It
      mattered more than expected: when the parts were finally designed,
      the base turned out 2.3× too heavy and the shoulder 40% too light, and
      every number computed from them before that had been arithmetic on
      guesses.
    steps:
      - do: Open the profile and find three things — a link's size, a joint limit in degrees, and a `provenance` field.
        run: less src/threevn_robot_description/config/threevn_arm_v1.yaml
      - do: See the same limits after expansion, now in radians.
        run: make urdf | grep "<limit"
        expect: '`elbow_joint` shows `lower="-2.0943951023931953"` — that is −120°.'
      - do: Compare the default arm with the long-reach profile.
        run: diff <(make urdf) <(make urdf PROFILE=threevn_arm_v1_long_reach)
        expect: >-
          Every changed line is a number — sizes, origins, masses, inertias.
          No link, joint or structural line differs.
      - do: Look at the long-reach arm.
        run: make view PROFILE=threevn_arm_v1_long_reach
    checkpoint: >-
      Every dimension in the generated description traces back to a value
      in `config/threevn_arm_v1.yaml`, and the diff between two profiles
      contains numbers only.
    pitfalls:
      - symptom: You edited the profile and the viewer still shows the old arm.
        cause: The description is read once, at launch.
        fix: Relaunch `make view`. With `--symlink-install`, editing needs no rebuild.
      - symptom: '`PROFILE=` names a new file you just created, and it is not found.'
        cause: A new file has no installed symlink until the workspace is rebuilt.
        fix: Run `make build` once after adding a profile.
      - symptom: Generating the URDF at CMake build time fails on `load_yaml`.
        cause: >-
          CMake's `xacro_add_files()` does not support `xacro.load_yaml()`
          (ros/xacro#298).
        fix: >-
          Expand at launch and test time only — which is what this project
          does, and why `CMakeLists.txt` installs directories and nothing
          else.
    concepts:
      - term: xacro
        meaning: >-
          The macro language robot descriptions are written in. It expands
          into plain URDF, and here it reads its numbers from YAML with
          `xacro.load_yaml()`.
      - term: Profile
        meaning: >-
          One YAML file holding every physical number for one robot. Swap the
          file, get a different robot; no model file changes.
      - term: Provenance
        meaning: >-
          Where a number came from — `measured`, `datasheet`, `estimated` or
          `computed` — recorded next to it and required by a test.
    quiz:
      - q: Why not generate a URDF with a script and commit the result?
        a: >-
          It creates a second artefact that drifts from the first. Sooner or
          later someone edits the generated file, and any test comparing
          source to output becomes meaningless.
      - q: Limits are stored in degrees and converted to radians inside xacro. Why does that make the consistency test better?
        a: >-
          A test comparing two copies of the same number in the same units is
          close to a tautology. A conversion in between gives it something to
          catch — a wrong factor, a missed site, a sign error.
    exercise:
      task: >-
        Count the lines in `diff <(make urdf) <(make urdf
        PROFILE=threevn_arm_v1_long_reach)`. Then estimate how many places
        you would have had to edit by hand if the numbers lived in the XML.
        Which of those edits would a reviewer have been likely to miss?
    read:
      - decisions/0005-yaml-single-source.md
      - development.md

  - id: inertia-is-computed
    title: Never type a number you can derive
    tags: [ros2, testing]
    builds_on: [one-source-of-truth]
    minutes: 25
    flavors:
      so101:
        note: >-
          this robot reverses the lesson. Its inertias were not computed
          here: they are upstream's, exported from CAD, and nothing in this
          project derived them. So the lesson becomes **check a number you
          did not derive**. The three checks above are the right ones, but
          the suite runs them only on the 3VN profiles, so on the SO-101 you
          run them yourself.
        steps:
          - do: Look at upstream's inertia tensors.
            run: make urdf PROFILE=so101_follower 2>/dev/null | grep "<inertia " | head -8
            expect: >-
              Non-zero `ixy`, `ixz` and `iyz` on most links. CAD exports a
              tensor about each link's own frame, not about its principal
              axes, so the off-diagonal terms are real. The 3VN arm's boxes
              have zeros there.
          - do: Confirm this project left them exactly as upstream wrote them.
            run: |
              diff -w <(grep "<inertia " vendor/so101/so101.urdf) \
                      <(make urdf PROFILE=so101_follower 2>/dev/null | grep "<inertia ")
              echo "exit status: $?"
            expect: '`exit status: 0`. Every tensor is upstream''s.'
          - do: Run the three checks on every link, inside the container.
            run: |
              make shell
              ros2 run threevn_robot_description describe so101_follower > /tmp/so101.urdf
              python3 - <<'PY'
              import xml.etree.ElementTree as ET
              import numpy as np
              total = 0.0
              for link in ET.parse('/tmp/so101.urdf').getroot().iter('link'):
                  inertial = link.find('inertial')
                  if inertial is None:
                      continue
                  total += float(inertial.find('mass').get('value'))
                  i = {k: float(v) for k, v in inertial.find('inertia').attrib.items()}
                  t = np.array([[i['ixx'], i['ixy'], i['ixz']],
                                [i['ixy'], i['iyy'], i['iyz']],
                                [i['ixz'], i['iyz'], i['izz']]])
                  a, b, c = sorted(np.linalg.eigvalsh(t))
                  print(f"{link.get('name'):26} positive definite: {a > 0}   triangle: {a + b >= c}")
              print(f'total mass {total:.3f} kg')
              PY
            expect: >-
              Seven links pass both checks. `gripper_frame_link` fails
              positive definite: its tensor is all zeros. Total mass
              0.632 kg.
          - do: Look at the link that failed.
            run: grep -n -A8 '<link name="gripper_frame_link"' /tmp/so101.urdf
            expect: >-
              A mass of `1e-9` and a zero tensor. It is not a body at all:
              it is the tool frame, on a fixed joint, and upstream gave it a
              token inertial block.
        checkpoint: >-
          You ran all three checks on upstream's tensors, every real link
          passed, and you can say why the one failure is a frame rather than
          a broken body.
        pitfalls:
          - symptom: The `python3` step fails on `import numpy`.
            cause: You ran it on the host rather than inside the container.
            fix: Run `make shell` first. The container has numpy; your laptop may not.
          - symptom: A check fails on `gripper_frame_link`, and the obvious fix is to give it a tensor.
            cause: >-
              The check assumes every link is a body, and this one is a
              frame. Gazebo folds links on fixed joints into their parent, so
              its token mass does nothing there. A tensor typed in to make
              the check pass would be a number nobody derived.
            fix: >-
              Leave upstream's file alone. Teach the check to skip massless
              frames, and write the reason into the test.
        quiz:
          - q: Why can you not check upstream's `upper_arm_link` by hand the way the lesson checks a box?
            a: >-
              It is a printed part with a servo inside, not a box. Its tensor
              came from integrating a CAD model, and there is no closed form
              to compare against. What you can check is that it describes a
              possible body.
          - q: '`gripper_frame_link` fails "positive definite". Is that a bug?'
            a: >-
              Not in the simulation: it is a massless frame on a fixed joint,
              and Gazebo folds it into its parent. It is a finding about the
              check, which assumes every link is a body.
        exercise:
          task: >-
            The suite's inertia tests are parametrised over the 3VN
            profiles only. Write down what it would take to run them on the
            SO-101 too: which fixture would describe it, what the tests
            should do with a massless frame, and whether a `min_inertia`
            floor even makes sense for numbers this project did not choose.
          hint: >-
            Look at `ALL_PROFILES` in `src/threevn_robot_description/test/conftest.py`,
            and at how `test_so101_profile.py` skips when the description has
            not been fetched.
        read:
          - testing.md
          - so101.md
    objective: Understand why inertia tensors are generated, never written, and check one by hand.
    body: |
      An inertia tensor describes how a body's mass is distributed — how
      hard it is to spin about each axis. Physics engines need one for every
      link. Typed by hand, it silently disagrees with the shape it describes,
      and the engine turns that disagreement into NaN the first time
      something touches something else.

      Here the tensor is **computed** from the same mass and dimensions that
      produced the geometry, by two small macros — one for boxes, one for
      cylinders. There is no step where a human transcribes it, so it cannot
      contradict the shape.

      Three checks run on every link of every profile, with no simulator:

      - the tensor is **symmetric**
      - it is **positive definite** — no axis has zero or negative
        resistance to rotation
      - its principal moments satisfy the **triangle inequality** — no one
        moment exceeds the other two combined, which no real body can do

      And a floor, `min_inertia`, because a near-zero value is another
      reliable way to produce NaN on first contact.

      Notice the cost model. A wrong tensor does not throw. It produces a
      simulation that looks plausible and is wrong — or that "explodes",
      which looks like an unstable simulator rather than a typo. Catching it
      in a test that runs in a second is the cheapest place it will ever be
      caught.

      This is also why the robot is built from primitive boxes and
      cylinders rather than meshes: every number is checkable by hand.
    steps:
      - do: Find the two macros that compute every tensor.
        run: grep -n "macro name=" src/threevn_robot_description/urdf/common/inertials.xacro
      - do: See the computed values in the expanded description.
        run: make urdf | grep "<inertia " | head -8
      - do: >-
          Check one by hand. `upper_arm_link` is a box 0.020 × 0.030 × 0.110 m
          with mass 0.0735 kg. For a box, `ixx = m(y² + z²)/12`. Work it out,
          then find it in the output.
        run: |
          make urdf | awk '/<link name="upper_arm_link">/{f=1} f && /<inertia /{print; exit}'
        expect: '`ixx="7.962499999999998e-05"` — your arithmetic, to the last digit that matters.'
      - do: Run the suite; the inertia tests are part of it.
        run: make test
    checkpoint: >-
      The inertia tests pass, and your hand-calculated `ixx` for one link
      matches the generated value.
    pitfalls:
      - symptom: The robot jitters, explodes or flies away the moment it spawns or touches something.
        cause: >-
          An impossible inertia — not positive definite, violating the
          triangle inequality, or nearly zero. It does not fail at load
          time.
        fix: >-
          Never type a tensor. Compute it from mass and shape, keep the
          `min_inertia` floor, and let `test_inertia_valid.py` catch it with
          no simulator.
      - symptom: The total-mass test fails right after you edited a mass.
        cause: An order-of-magnitude slip — grams typed into a field that holds kilograms.
        fix: Masses are in kilograms. The plausibility band, 0.2–3.0 kg, exists to catch exactly this.
    concepts:
      - term: Inertia tensor
        meaning: >-
          A 3×3 matrix describing how a body's mass is distributed about its
          axes — how hard it is to rotate. Required for every simulated link.
      - term: Positive definite
        meaning: >-
          For an inertia tensor: every axis resists rotation with a positive
          moment. A tensor that is not is physically impossible.
    quiz:
      - q: Why is an invalid inertia worse than a parse error?
        a: >-
          A parse error stops you at load time with a line number. An invalid
          inertia loads fine and produces NaN on first contact, which looks
          like an unstable simulator and costs hours.
      - q: Why does building the arm from boxes and cylinders help the tests?
        a: >-
          Primitives have closed-form inertias, so every value can be derived
          and checked by hand. A mesh needs numerical integration and hides
          its numbers.
    exercise:
      task: >-
        Compute `iyy` and `izz` for `upper_arm_link` as well, and check that
        all three satisfy the triangle inequality. Then invent a tensor that
        is symmetric and positive definite but violates it — and describe a
        body that could have it.
      hint: >-
        For a box, `iyy = m(x² + z²)/12` and `izz = m(x² + y²)/12`.
      answer: >-
        No real body can have one moment exceeding the sum of the other two,
        which is precisely the point of the check: a tensor can pass the
        algebraic tests and still describe something impossible.
    read:
      - testing.md
      - decisions/0004-own-geometry.md

  - id: frames-that-pay-later
    title: Three frames that save you a day each
    tags: [ros2, motion]
    builds_on: [links-and-joints]
    minutes: 30
    flavors:
      so101:
        note: >-
          the SO-101 has none of the three frames by those names, and that is
          worth noticing. Its root is `world`, clamped to `base_link` by a
          fixed joint, because the arm is bolted to a bench and has no base
          to drive. Its tool frame is upstream's `gripper_frame_link`, at the
          tip of the fixed jaw, rather than `tool0`. And it has no camera
          frame yet, because this description has no camera. The ideas carry
          over unchanged: one writer to TF, and a tool frame named once, in
          the profile, so nothing else hard-codes it.
        steps:
          - do: Start the viewer, and open **http://localhost:8106/vnc.html**.
            run: make view PROFILE=so101_follower
          - do: Find where the tool frame and the base frame are named.
            run: grep -n -E "base_frame|tool_frame" src/threevn_robot_description/config/so101_follower.yaml
            expect: >-
              `base_frame: base_link` and `tool_frame: gripper_frame_link`.
              The scenarios and the robot client read these instead of
              typing a frame name.
          - do: In a second terminal, confirm the root of the tree.
            run: |
              make shell
              ros2 run tf2_ros tf2_echo world base_link
            expect: >-
              Zero translation and zero rotation. This transform is the bench
              clamp, and it is the same on every target.
          - do: Read where the tool is, then move `shoulder_pan` in the slider window and read it again.
            run: ros2 run tf2_ros tf2_echo base_link gripper_frame_link
            expect: >-
              With every slider at zero, the jaw tip about 0.39 m out along
              x and 0.23 m up. Drag `shoulder_pan` positive and y goes
              negative: the arm swings to its right.
        checkpoint: >-
          You can read the transform from `world` to `gripper_frame_link` on
          the running SO-101, and say where its tool frame is named and why
          nothing else names it.
        pitfalls:
          - symptom: '`tf2_echo base_link tool0` waits forever and prints nothing.'
            cause: The SO-101 has no `tool0`. Its tool frame is upstream's `gripper_frame_link`.
            fix: Check names against `make urdf PROFILE=so101_follower | grep "<link name="`.
          - symptom: '`tf2_echo` waits forever for any pair of frames.'
            cause: Nothing is publishing TF, because the viewer is not running.
            fix: Keep `make view PROFILE=so101_follower` running in the first terminal.
        quiz:
          - q: The SO-101 has no `base_footprint`. Why does it not need one?
            a: >-
              `base_footprint` exists so a mobile base can be attached with
              one joint. The SO-101 is clamped to a bench, so its root is
              `world` and the clamp is that one joint.
          - q: Why is the tool frame named in the profile rather than written into the scenarios as `gripper_frame_link`?
            a: >-
              The same scenarios drive the 3VN arm, whose tool frame has a
              different name. Named once, in each robot's profile, the
              scenarios work on both and neither robot's name leaks into
              the other's code.
        exercise:
          task: >-
            The SO-101 will get a wrist camera. Sketch the two frames it
            needs, `camera_link` and `camera_optical_frame`, with the fixed
            rotation between them. Then decide where they should live. The
            overlay restates no geometry, and a camera mount is geometry that
            upstream did not design. What does that leave?
          hint: >-
            Upstream published a wrist-camera variant of its URDF in
            September 2026. Compare pinning a different upstream file with
            adding a mount to the overlay.
        read:
          - architecture.md
          - perception.md
          - so101.md
    objective: Place the frames later phases assume, and read any transform between them on a live robot.
    body: |
      Every link carries a coordinate frame, and ROS keeps them all in one
      time-indexed tree called **TF**. Ask "where was the gripper relative
      to the camera 0.3 seconds ago" and TF answers, interpolating if it
      must. In this project exactly one thing writes to it,
      `robot_state_publisher`, which reads the description and the live
      joint positions. Nothing else ever publishes a transform by hand.

      Three frames cost nothing on day one and pay later:

      - **`base_footprint`**, a weightless root on the ground. Attaching a
        mobile base becomes one joint rather than a restructuring — which is
        exactly what happens in the *Put it on wheels* side track.
      - **`tool0`**, the conventional name for the tool flange. Every
        inverse-kinematics tutorial and motion planner expects it, so the
        convention is free if you adopt it early.
      - **`camera_optical_frame`**, separate from `camera_link`.

      That last one is the day-saver. Cameras and robots disagree about
      axes: robot bodies use *x forward, z up*; the optical convention is
      *z forward, x right, y down*. A fixed joint carrying exactly that
      rotation — roll −90°, yaw −90° — lets each side keep its own
      convention. Getting it wrong is the commonest perception bug there is:
      everything runs, the rate is right, the numbers look plausible, and
      the arm reaches 90° away from the object.

      A frame also caught a real bug before any camera existed. A test
      comparing two independent computations of the transforms found the
      camera mount tilted **up at the ceiling** instead of down at the
      workspace.

      One thing will look broken in Gazebo later, so know it now: Gazebo
      merges links joined by fixed joints, so `tool0` may not exist there at
      all. That does not matter, because TF comes from the description, not
      from Gazebo.
    steps:
      - do: Start the viewer, and open the browser view.
        run: make view
      - do: In a second terminal, read the camera's optical rotation.
        run: |
          make shell
          ros2 run tf2_ros tf2_echo camera_link camera_optical_frame
        expect: 'A rotation of `[-1.571, 0.000, -1.571]` in roll-pitch-yaw radians — roll and yaw of −90°.'
      - do: Read where the tool is, then move `shoulder_pan` in the slider window and read it again.
        run: ros2 run tf2_ros tf2_echo base_link tool0
        expect: The translation changes as you drag; the rotation follows the pan.
      - do: Confirm the root of the tree.
        run: ros2 run tf2_ros tf2_echo base_footprint base_link
    checkpoint: >-
      You can read the transform between any two frames on the running
      robot, and you know which convention each side of the optical rotation
      uses.
    pitfalls:
      - symptom: '`tf2_echo` waits forever and prints nothing.'
        cause: Nothing is publishing TF — the viewer is not running — or a frame name is misspelled.
        fix: Keep `make view` running; check names against `make urdf | grep "<link name="`.
      - symptom: Later, perception reports objects in the wrong place by roughly 90 degrees.
        cause: Image data tagged with `camera_link` instead of `camera_optical_frame`.
        fix: The image belongs to the optical frame. Tier 6 shows where this is set.
    concepts:
      - term: TF
        meaning: >-
          ROS's time-indexed tree of coordinate frames. Here,
          `robot_state_publisher` is the only thing that writes to it.
      - term: Optical frame
        meaning: >-
          The camera convention — z forward, x right, y down — kept in a
          frame separate from the camera body, joined by a fixed rotation.
      - term: tool0
        meaning: >-
          The conventional name for the arm's tool flange, expected by motion
          planners and inverse-kinematics code.
      - term: REP-103 and REP-105
        meaning: >-
          The ROS conventions for units and axis directions, and for the
          standard frames a mobile robot has (`base_link`, `odom`, `map`).
    quiz:
      - q: Gazebo has no `tool0` link. Why is that not a problem here?
        a: >-
          Gazebo merges fixed-joint links, but TF comes from
          `robot_state_publisher` reading the description, not from Gazebo.
          `tool0` exists wherever it matters.
      - q: Why should `robot_state_publisher` be the only source of transforms?
        a: >-
          Two publishers of one transform means consumers see whichever
          arrived last. The robot appears to jitter between two answers and
          no log says why.
    exercise:
      task: >-
        With `make view` running, echo `base_link` to
        `camera_optical_frame`. Without looking anything up, use the
        rotation to work out which way the camera is pointing relative to
        the arm's base. Then check your answer by looking at RViz.
    read:
      - architecture.md
      - perception.md

  - id: two-parsers
    title: Test it with two parsers, not one
    tags: [ros2, testing]
    builds_on: [fast-tests-or-no-tests]
    minutes: 30
    flavors:
      so101:
        note: >-
          the SO-101 is not in either automatic check yet. `make lint` runs
          `check_urdf` on every profile named `threevn_*.yaml`, and the
          duplicate-name test is parametrised over the same set, so the
          SO-101's overlay is skipped by both. Here you run the second parser
          by hand, and look at the gap honestly. The SO-101 does keep the
          other principle: its tests and its launch files get the
          description from the same function, `describe()`.
        steps:
          - do: See why the automatic check skips this robot.
            run: grep -n "threevn_\*" scripts/check_description.sh
            expect: >-
              The loop globs `threevn_*.yaml`. The SO-101's profile is named
              so that it does not match, because its description is not
              built from this project's xacro.
          - do: Run the C++ parser on all three of the SO-101's targets, inside the container.
            run: |
              make shell
              for t in mock gz feetech; do
                ros2 run threevn_robot_description describe so101_follower --target $t > /tmp/so101_$t.urdf
                check_urdf /tmp/so101_$t.urdf > /dev/null && echo "ok    $t" || echo "FAIL  $t"
              done
            expect: '`ok` for `mock`, `gz` and `feetech`.'
          - do: Check for duplicate link names in the raw XML, the way the 3VN arm's test does.
            run: grep -o '<link name="[^"]*"' /tmp/so101_gz.urdf | sort | uniq -d
            expect: >-
              No output: no name appears twice. A parsed model could not have
              told you, because it keeps only one link per name.
          - do: Confirm the launch files and the tests describe the robot the same way.
            run: grep -n "describe(" src/threevn_robot_description/launch/view_robot.launch.py src/threevn_sim/launch/sim.launch.py src/threevn_bringup/launch/robot.launch.py
            expect: >-
              The viewer, the simulator and the real-hardware launch all call
              `describe()`. The SO-101's tests call the same function, so
              they check the description that actually runs.
        checkpoint: >-
          `check_urdf` accepts the SO-101 on all three targets, no link name
          is duplicated, and you can say which automatic checks do not cover
          this robot yet and why.
        pitfalls:
          - symptom: '`make lint` passes and you assume the SO-101 was checked.'
            cause: The script globs `threevn_*.yaml`, and a green run only covers what it ran.
            fix: Read the per-profile lines it prints. The SO-101 is not among them until the script learns about vendor arms.
          - symptom: '`describe` fails, and every `check_urdf` line says `FAIL`.'
            cause: The upstream description has not been fetched into `vendor/`, so there was nothing to check.
            fix: Run `make so101-fetch` on the host, then try again.
        exercise:
          task: >-
            Sketch the change that would put the SO-101 into `make lint`:
            how `check_description.sh` should find vendor arms, which targets
            it should expand for each, and what it should do when the upstream
            description has not been fetched, as on a fresh CI runner.
          hint: >-
            `describe.py` has a `targets()` function, and `test_so101_profile.py`
            shows one way to handle a missing description without hiding it.
        read:
          - testing.md
          - so101.md
    objective: Check a description with independent tools, and know which bugs only raw XML reveals.
    body: |
      The description is checked by two parsers written by different people
      in different languages: `urdf_parser_py` in the Python unit tests, and
      `check_urdf`, the C++ reference parser, in `make lint`. They have
      different leniencies, so a disagreement between them is itself a
      finding.

      Some bugs are invisible to *any* parser, though, and the best example
      is a duplicated link name. `urdf_parser_py` builds a dictionary keyed
      by name, so the second link silently replaces the first and the parsed
      tree looks perfectly healthy. The duplicate only exists **before**
      parsing. So that test reads the raw XML.

      This is not hypothetical. When the arm was later mounted on the mobile
      base, both descriptions declared an `imu_link`. Two links, one name —
      not a parse error, just a quiet loss of one of them. A test now asserts
      both survive the composition.

      One more principle is easy to violate without noticing. Every test
      builds its description through a shared fixture that expands **the
      same entry point with the same arguments** that `ros2 launch` uses at
      runtime. A test that built its URDF some other way would be testing
      itself — a description nobody runs.
    steps:
      - do: Run the linters and the C++ parser across every profile.
        run: |
          make lint
          echo "exit status: $?"
        expect: '`exit status: 0`. Check the status, not the text — a later lesson shows why.'
      - do: Read the script that runs the independent parser.
        run: less scripts/check_description.sh
      - do: Read the duplicate-name test, and notice what it parses.
        run: grep -n -A20 "def test_no_duplicate_link_names" src/threevn_robot_description/test/test_urdf_structure.py
      - do: Find the fixture every description test shares.
        run: grep -n -A15 "def expanded" src/threevn_robot_description/test/conftest.py
    checkpoint: >-
      `make lint` exits 0, and you can explain why the duplicate-name check
      cannot be done on the parsed model.
    pitfalls:
      - symptom: Lint looked green, and CI went red on the same code.
        cause: The output was searched for the word "FAIL" instead of the exit status being checked.
        fix: Trust exit codes. `echo $?` immediately after the command.
      - symptom: Lint reports failures you have already fixed.
        cause: Stale result files from an earlier run.
        fix: '`make lint` clears them first; if you ran colcon by hand, clear `build/*/test_results`.'
    concepts:
      - term: Independent oracle
        meaning: >-
          A second, separately written implementation used to check the
          first. Agreement means something; disagreement is a finding.
      - term: Shared fixture
        meaning: >-
          One function every test uses to build its input, so all tests
          check the artefact that actually runs.
    quiz:
      - q: Why does a parsed-model check miss a duplicated link name?
        a: >-
          The parser stores links in a dictionary keyed by name, so the
          second silently overwrites the first. After parsing there is only
          one — and the tree looks fine.
      - q: What is wrong with a test that builds its URDF with slightly different arguments from the launch file?
        a: >-
          It checks a description nobody runs. It can pass while the real one
          is broken.
    exercise:
      task: >-
        Find one more property of a description that the parsed model hides
        and only the raw XML shows. Write the test that would check it, as a
        sketch.
      hint: >-
        Think about anything a dictionary or object model throws away:
        duplicates of other kinds, ordering, comments, attributes the parser
        does not know about.
    read:
      - testing.md

  - id: limits-from-the-datasheet
    title: Limits come from the datasheet
    tags: [ros2, hardware, safety]
    builds_on: [links-and-joints]
    minutes: 25
    flavors:
      so101:
        note: >-
          the servos are six Feetech STS3215s rather than MG996Rs and an
          SG90, and the story is sharper. Upstream's URDF declares
          `effort="10"` and `velocity="10"` on every joint. Those are
          placeholders: 10 N·m is about five times what an STS3215 stalls
          at. Left alone, the simulated arm would lift what the real one
          cannot. So the overlay replaces both from the datasheet, derated
          because the official bill of materials runs these 7.4 V servos
          from a 5 V supply. That derating is an estimate, and the first
          session on the physical arm is planned to measure it.
        steps:
          - do: Read the datasheet block.
            run: grep -n -A14 "^servos:" src/threevn_robot_description/config/so101_follower.yaml
            expect: >-
              `stall_torque_nm: 1.912` and `no_load_speed_rads: 4.712`, with
              `provenance: datasheet` and a comment on why sellers disagree.
          - do: Read the derating, and work out the two limits by hand.
            run: grep -n -A7 "^limit_derate:" src/threevn_robot_description/config/so101_follower.yaml
            expect: >-
              `effort: 0.68` and `velocity: 0.37`. So 1.912 × 0.68 and
              4.712 × 0.37. Write both answers down.
          - do: Compare upstream's limits with the ones that run.
            run: |
              grep -m1 "<limit" vendor/so101/so101.urdf
              make urdf PROFILE=so101_follower 2>/dev/null | grep -m1 "<limit"
            expect: >-
              `effort="10" velocity="10"` upstream, then `effort="1.3002"
              velocity="1.7434"`: your two answers, rounded. The position
              limits are the same on both lines.
          - do: >-
              Break it. In `so101_follower.yaml`, raise
              `limit_derate.effort` to `1.2` and run the suite.
            run: make test
            expect: >-
              `test_limits_never_exceed_what_the_servo_can_deliver` fails,
              and so does `test_upstreams_placeholder_limits_are_replaced`.
              The first is the rule; the second notices that the limit is
              climbing back toward upstream's placeholder.
          - do: Revert, and confirm green.
            run: |
              git checkout src/threevn_robot_description/config/so101_follower.yaml
              make test
        checkpoint: >-
          You derived the SO-101's effort and velocity limits by hand, found
          them in the running description, and watched the suite reject a
          derating above 1.
        pitfalls:
          - symptom: A motion works every time in simulation and stalls on the real arm.
            cause: The simulated joint was allowed more torque than the real servo has. Upstream's `effort="10"` is exactly this.
            fix: Derive effort from the datasheet, and let `test_so101_profile.py` hold the line.
          - symptom: The limits look right but the arm is weaker than predicted on the bench.
            cause: >-
              The derating assumes a 5 V supply. A different supply, or a
              seller's figure for a different voltage, changes the real
              number.
            fix: >-
              Measure it. The servos report their own load, so a bench
              session can replace `estimated` with `measured`.
        quiz:
          - q: Upstream's effort of 10 N·m is too high. Why is that a simulation bug rather than a hardware one?
            a: >-
              The real servo simply cannot exceed its stall torque. The
              simulator can, so it validates motions the arm will never
              perform.
          - q: Why is the effort derated by 0.68 when the datasheet already gives a stall torque?
            a: >-
              The datasheet figure is for 7.4 V and the official build
              supplies 5 V. Torque falls roughly with voltage, and 5 / 7.4 is
              about 0.68. It is an estimate until someone measures it.
        exercise:
          task: >-
            Estimate the torque `shoulder_lift` needs to hold the arm
            straight out horizontally. Use the masses in the description
            (`make urdf PROFILE=so101_follower | grep "<mass"`) and the joint
            origins for the link lengths. Compare it to the 1.30 N·m the
            joint is allowed. Then add a 100 g payload at the jaw and do it
            again. How much headroom is left?
          hint: >-
            The upper arm is about 0.116 m from shoulder to elbow and the
            forearm about 0.135 m from elbow to wrist. Treat each link's mass
            as sitting at its middle, and put the wrist and gripper masses at
            the wrist.
        read:
          - hardware.md
          - so101.md
    objective: Derive effort and speed limits from the motors that must deliver them, and prove no joint exceeds them.
    body: |
      A joint's limits are not only *where* it may go. They also say how hard
      it may push — effort — and how fast it may turn. Here both are derived
      from the servo datasheets at 4.8 V, the voltage the bill of materials
      actually specifies, and recorded in a `servos:` block with
      `provenance: datasheet`.

      The reason is the whole point of a simulator in this project. An
      effort limit above the servo's stall torque lets the simulated arm
      perform motions the real one cannot. **The motion succeeds in Gazebo
      and stalls on the bench** — the sim-to-real gap this platform exists to
      catch before it costs a print.

      So a test fails if any joint is configured beyond what its servo can
      deliver. It has caught real ones. The mobile base's wheels were
      configured at 20.0 rad/s against a motor ceiling of 19.95 — 21.0
      no-load, derated by 5%. The gripper is held deliberately *below* its
      ceiling: configured at stall, a gripper crushes what it picks up and
      cooks the servo holding it closed.

      Speed limits are derated because a datasheet's no-load speed is a
      best case. A motor carrying a load, at a slightly low voltage, never
      reaches it.

      This test checks configuration against capability. It cannot tell
      you whether the arm can hold *itself* up — that needs masses, lengths
      and gravity. Tier 6 measures that in simulation and finds the arm
      sagging several degrees short at full extension.
    steps:
      - do: Read the datasheet block and its two servos.
        run: grep -n -A6 -E "^  (mg996r|sg90):" src/threevn_robot_description/config/threevn_arm_v1.yaml
        expect: '`stall_torque_nm: 0.922` for the MG996R, `0.177` for the SG90.'
      - do: See which servo each joint names, and its configured effort.
        run: grep -n -E "servo:|effort" src/threevn_robot_description/config/threevn_arm_v1.yaml
      - do: >-
          Break it. Raise `shoulder_lift_joint`'s `effort` to `1.5` and run
          the suite.
        run: make test
        expect: '`test_revolute_effort_within_servo_stall_torque` fails, naming the joint and the servo.'
      - do: Revert, and confirm green.
        run: |
          git checkout src/threevn_robot_description/config/threevn_arm_v1.yaml
          make test
    checkpoint: >-
      You watched the servo-limit test reject a joint configured beyond its
      motor, and you can explain why that matters more in simulation than on
      the bench.
    pitfalls:
      - symptom: A motion works every time in simulation and stalls on the real arm.
        cause: The simulated joint was allowed more torque than the real servo has.
        fix: Derive effort from the datasheet and let `test_servo_limits.py` hold the line.
    concepts:
      - term: Stall torque
        meaning: >-
          The most torque a motor produces, at zero speed. Commanding more
          than this cannot work on the real hardware.
      - term: Derating
        meaning: >-
          Deliberately using less than a datasheet's best-case figure, to
          allow for load, voltage and wear.
    quiz:
      - q: Why is an effort limit above stall torque a simulation bug rather than a hardware one?
        a: >-
          The hardware simply cannot exceed its stall torque. The simulator
          can, so the danger is a simulation that validates motions the robot
          will never perform.
      - q: Why configure the gripper below its servo's ceiling rather than at it?
        a: >-
          At stall it crushes what it holds and heats the servo continuously
          while holding closed.
    exercise:
      task: >-
        Estimate the torque `shoulder_lift` needs to hold the arm straight
        out horizontally, using the computed masses in the profile and the
        link lengths. Compare it to 0.922 N·m. Then add a 100 g payload at
        the gripper and do it again. How much headroom is left?
      hint: >-
        Torque is the sum of each mass × g × its horizontal distance from the
        joint. Treat each link's mass as sitting at its middle; the
        `upper_arm_link` mass includes the elbow servo, so you may want to
        place part of it at the elbow.
    read:
      - hardware.md
      - bom-hardware.md

project:
  title: Make the description lie
  minutes: 45
  brief: |
    A robot description is only as trustworthy as the checks that would
    notice it lying. Change your robot's profile in three small, wrong
    ways, one at a time, and for each one name the test that catches it.
    Then find a lie that nothing catches. That is the better result,
    because it is a test this project does not have yet.

    Designing a profile of your own, rather than breaking one, is the
    project in the *Make your own robot* side track.
  tasks:
    - do: Run the suite once and write down its summary line, so you know what green looks like.
      run: make test
    - do: >-
        First lie: in `src/threevn_robot_description/config/threevn_arm_v1.yaml`,
        delete one link's `provenance` line. Run the suite and write down
        the test that fails. Revert before the next lie.
      run: |
        make test
        git checkout src/threevn_robot_description/config/threevn_arm_v1.yaml
    - do: >-
        Second lie: raise `shoulder_lift_joint`'s `effort` to `1.5`, above
        what its servo can stall at. Run the suite, write down the failing
        test, and revert.
      run: |
        make test
        git checkout src/threevn_robot_description/config/threevn_arm_v1.yaml
    - do: >-
        Third lie: give one link a negative dimension. Run the suite, write
        down the failing test, and revert.
      run: |
        make test
        git checkout src/threevn_robot_description/config/threevn_arm_v1.yaml
    - do: >-
        Now invent a lie of your own that the suite does not catch. Make the
        change, confirm `make test` stays green, and write two lines: what
        the lie is, and the test that would catch it. Revert.
  done_when:
    - Three lies, each caught by a test you can name.
    - One lie the suite does not catch, written down with the test that would catch it.
    - '`git status` shows the profile unchanged.'
  hints:
    - title: Which test caught it?
      body: >-
        pytest prints a header for each failure with the test's name, and
        the assertion message usually names the link or joint. Read the
        first failure, not the summary.
    - title: Nothing failed
      body: >-
        Check that you saved the file, and that the summary line shows the
        same number of tests as your green run. If it does, you may have
        found your uncaught lie early.
  read:
    - testing.md
    - development.md
  flavors:
    so101:
      note: >-
        the lies go into `so101_follower.yaml`, the overlay. Upstream's URDF
        is fetched, not committed, so you cannot lie in it here; and the
        overlay restates no geometry, so there is no dimension to make
        negative.
      tasks:
        - do: Run the suite once and write down its summary line, so you know what green looks like.
          run: make test
        - do: >-
            First lie: in `src/threevn_robot_description/config/so101_follower.yaml`,
            raise `limit_derate.effort` from `0.68` to `1.2`, so the joints
            may push harder than the servo can. Run the suite, write down
            the test that fails, and revert.
          run: |
            make test
            git checkout src/threevn_robot_description/config/so101_follower.yaml
        - do: >-
            Second lie: set the gripper's `open` to `1.7`, a few degrees
            short of the jaw's hard stop. Run the suite, write down the
            failing test, and revert.
          run: |
            make test
            git checkout src/threevn_robot_description/config/so101_follower.yaml
        - do: >-
            Third lie: delete the last value from the `ready` pose, leaving
            four positions for five joints. That is the bug that once stopped
            every scenario at `home`. Run the suite, write down the first
            failing test, and revert.
          run: |
            make test
            git checkout src/threevn_robot_description/config/so101_follower.yaml
        - do: >-
            Now invent a lie of your own that the suite does not catch. Make
            the change, confirm `make test` stays green, and write two lines:
            what the lie is, and the test that would catch it. Revert.
      done_when:
        - Three lies, each caught by a test you can name.
        - One lie the suite does not catch, written down with the test that would catch it.
        - '`git status` shows the profile unchanged.'
      read:
        - testing.md
        - so101.md
