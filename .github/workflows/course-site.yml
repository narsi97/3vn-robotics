# The course site check: every PR and merge to main that touches the site.
#
#   pull request / merge to main  →  course-check → site → docker build
#                                    (nothing pushed, no secrets, GitHub's runners)
#
# The course site: docs/ and course/ rendered by scripts/build_site.py and
# served by nginx on the shared host, at 3vnsystems.com/robotics/. Robot
# releases are release.yml.
#
# Building the image for prod and deploying it happen in 3vn-infra
# (.github/workflows/robotics-course.yml: Actions → Course site → Run
# workflow, with a commit from this repo's main), not here. This repo has
# been public since 2026-11-15, and GitHub lets a private repo's reusable
# workflows be called only from private repos, so this file can no longer
# `uses:` 3vn-infra's app-pipeline.yml or deploy-app.yml. In GitLab terms:
# the infra project's pipeline clones this repo, rather than this repo
# including the infra templates. It also means this public repo holds
# nothing that can reach a host.
#
# What runs here is the same gate, minus the push: the curriculum check, the
# render, and the image build, so a PR that would break the prod build fails
# here first. Fork PRs are safe to run: read-only token, no secrets.
name: Course site

run-name: >-
  ${{ github.event_name == 'pull_request' && format('check PR #{0}', github.event.number)
   || format('check {0}', github.ref_name) }}

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'course/**'
      - 'scripts/build_site.py'
      - 'Makefile'
      - 'VERSION'
      - 'docker/Dockerfile.site'
      - 'docker/Dockerfile.site.dockerignore'
      - '.github/workflows/course-site.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'course/**'
      - 'scripts/build_site.py'
      - 'Makefile'
      - 'VERSION'
      - 'docker/Dockerfile.site'
      - 'docker/Dockerfile.site.dockerignore'
      - '.github/workflows/course-site.yml'

permissions:
  contents: read

# A newer push to the same PR makes the older check irrelevant.
concurrency:
  group: course-site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Every lesson's YAML parses, and every Make target a lesson names exists.
      - name: make course-check
        run: make course-check

      # The render the image does.
      - name: make site
        run: make site

      # The prod image, built and not pushed: the Dockerfile still works.
      - name: docker build (not pushed)
        run: |
          docker build -f docker/Dockerfile.site \
            --build-arg THREEVN_GIT_COMMIT="$GITHUB_SHA" \
            -t robotics-course-site:check .

      - name: summary
        env:
          EVENT: ${{ github.event_name }}
        run: |
          {
            echo "### Course site: $(find site -name '*.html' | wc -l) pages rendered, image builds"
            if [ "$EVENT" = push ]; then
              echo ""
              echo "To put this on prod: 3vn-infra → Actions → Course site → **Run workflow**, sha \`$(git rev-parse --short=7 HEAD)\` (or blank for the tip of main)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
