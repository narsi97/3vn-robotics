; Virtual display + VNC + web bridge, so RViz and the Gazebo GUI are
; reachable from the host browser at http://localhost:8106/vnc.html
; with no X server on macOS. See ADR-0002.
[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid
user=dev

[program:xvfb]
; 24-bit depth matters: RViz renders incorrectly at 16.
command=/usr/bin/Xvfb :1 -screen 0 %(ENV_THREEVN_SCREEN)sx24 -nolisten tcp
autorestart=true
priority=100
stdout_logfile=/tmp/xvfb.log
stderr_logfile=/tmp/xvfb.err

[program:fluxbox]
; A window manager is not cosmetic here: without one, RViz dialogs open
; without decorations and cannot be moved or resized.
command=/usr/bin/fluxbox -display :1
autorestart=true
priority=200
stdout_logfile=/tmp/fluxbox.log
stderr_logfile=/tmp/fluxbox.err

[program:x11vnc]
; -nopw is safe ONLY because compose binds this to 127.0.0.1. Never
; publish 5900 or 8080 on 0.0.0.0.
;
; -threads and -speeds lan are for the NATIVE viewer path on port 5906:
; the link is loopback, so x11vnc should not throttle as if it were on
; a slow network. Deliberately NOT tuning -wait/-defer down: those make
; x11vnc poll the screen harder, and on this box the renderer is already
; contending with the physics engine for the same CPU.
;
; ONE LINE, no backslash. This is an INI file, not a shell script: a
; trailing \ is not a continuation, it is passed to x11vnc as an
; argument, which makes it print its usage and exit 1 -- and supervisord
; then retries it into a FATAL state, taking noVNC down with it.
command=/usr/bin/x11vnc -display :1 -forever -shared -nopw -rfbport 5900 -localhost -quiet -threads -speeds lan
autorestart=true
priority=300
stdout_logfile=/tmp/x11vnc.log
stderr_logfile=/tmp/x11vnc.err

[program:x11vnc-native]
; A SECOND server, for native viewers on the published port 5906.
;
; It exists because of one measured fact: x11vnc with -nopw offers only
; RFB security type 1 ("None"), and macOS Screen Sharing will not accept
; that -- it opens the TCP connection, never finishes the handshake, and
; shows "Connecting..." indefinitely with no error. Verified by probing
; the server directly: it offers [1] whether the client announces RFB
; 3.3, 3.7, 3.8 or Apple's 3.889.
;
; Giving THIS instance a password makes it offer type 2 (VNC
; Authentication), which every native client completes. The browser
; instance above keeps -nopw so noVNC needs no password, and is now
; -localhost so only websockify inside the container can reach it.
;
; The password comes from entrypoint.sh; see there for why it is not a
; secret.
command=/usr/bin/x11vnc -display :1 -forever -shared -rfbport 5901 -quiet -threads -speeds lan -rfbauth %(ENV_HOME)s/.vnc/passwd
autorestart=true
priority=300
stdout_logfile=/tmp/x11vnc-native.log
stderr_logfile=/tmp/x11vnc-native.err

[program:novnc]
command=/usr/bin/websockify --web /usr/share/novnc 8080 127.0.0.1:5900
autorestart=true
priority=400
stdout_logfile=/tmp/novnc.log
stderr_logfile=/tmp/novnc.err
