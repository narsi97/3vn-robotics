; Virtual display + VNC + web bridge, so RViz and the Gazebo GUI are
; reachable from the host browser at http://localhost:8106/vnc.html
; with no X server on macOS. See ADR-0002.
[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid
user=dev

[program:xvfb]
; 24-bit depth matters: RViz renders incorrectly at 16.
command=/usr/bin/Xvfb :1 -screen 0 1600x900x24 -nolisten tcp
autorestart=true
priority=100
stdout_logfile=/tmp/xvfb.log
stderr_logfile=/tmp/xvfb.err

[program:fluxbox]
; A window manager is not cosmetic here: without one, RViz dialogs open
; without decorations and cannot be moved or resized.
command=/usr/bin/fluxbox -display :1
autorestart=true
priority=200
stdout_logfile=/tmp/fluxbox.log
stderr_logfile=/tmp/fluxbox.err

[program:x11vnc]
; -nopw is safe ONLY because compose binds this to 127.0.0.1. Never
; publish 5900 or 8080 on 0.0.0.0.
command=/usr/bin/x11vnc -display :1 -forever -shared -nopw -rfbport 5900 -quiet
autorestart=true
priority=300
stdout_logfile=/tmp/x11vnc.log
stderr_logfile=/tmp/x11vnc.err

[program:novnc]
command=/usr/bin/websockify --web /usr/share/novnc 8080 127.0.0.1:5900
autorestart=true
priority=400
stdout_logfile=/tmp/novnc.log
stderr_logfile=/tmp/novnc.err
