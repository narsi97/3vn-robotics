# 3VN Arm v1 -- the single source of physical truth.
#
# Nothing under urdf/ hardcodes a dimension, a mass or a limit. It all
# comes from here, read directly by xacro via xacro.load_yaml(). To build
# a variant, copy this file and pass it as params_file:= -- changing a
# number NEVER requires editing a xacro.
#
# provenance: how much to trust each value.
#   measured  - calipers and a scale, on the physical article
#   datasheet - from the vendor spec
#   estimated - an engineer's guess. MUST be re-measured after fabrication.
#               Tracked as a Phase 5 task in docs/roadmap.md.
# Every mass must declare one. test_config_schema.py enforces it, because
# right now every value here is a guess and that should be visible in the
# file rather than implied by a comment.
#
# Units live in the key name on purpose: *_deg is degrees, a bare limit on
# a prismatic joint is metres. Servo datasheets are written in degrees and
# so are humans; the deg->rad conversion happens inside xacro, which is
# exactly what makes test_limits_match_yaml.py a real test.

meta:
  # ROS-legal identifier: lowercase, leading letter. Used for the URDF
  # robot name and anywhere a namespace or frame prefix might be derived.
  # See docs/decisions/0001-package-naming.md -- "3vn_arm_v1" would be a
  # latent runtime failure the first time it reached DDS.
  model: threevn_arm_v1
  # Which robot family this profile describes. The shared test suite uses
  # it to pick the xacro entry point and the expectations that apply --
  # an arm profile validated against base rules (or the reverse) would
  # fail for reasons that have nothing to do with the robot.
  kind: arm
  display_name: "3VN Arm v1"
  dof: 4
  revision: 1

defaults:
  # kg.m^2 floor. Near-zero inertia is a reliable way to make the physics
  # engine emit NaN the instant a contact force appears.
  min_inertia: 1.0e-7
  collision_margin: 0.002   # m, added to every collision primitive
  joint_damping: 0.05
  joint_friction: 0.01

# Servo datasheet values. Joint effort/velocity limits are DERIVED from
# these, not guessed, and test_servo_limits.py asserts no joint is ever
# configured beyond what its servo can physically deliver.
#
# Why this matters: an effort limit above the servo's stall torque lets
# the controller command force the hardware cannot produce. The motion
# then succeeds in Gazebo and stalls on the bench -- the exact sim-to-real
# mismatch this platform exists to catch.
#
# Figures are the 4.8 V column, because BOM specifies a 5 V supply.
# Source: servodatabase.com (TowerPro MG996R, TowerPro SG90).
servos:
  mg996r:
    voltage: 4.8
    stall_torque_nm: 0.922      # 9.40 kg.cm
    no_load_speed_rads: 5.51    # 0.19 s/60deg
    mass_kg: 0.055
    provenance: datasheet
  sg90:
    voltage: 4.8
    stall_torque_nm: 0.177      # 1.80 kg.cm
    no_load_speed_rads: 8.73    # 0.12 s/60deg
    mass_kg: 0.009
    provenance: datasheet

# Fraction of datasheet figures we allow a joint limit to use.
# Stall torque is a stall figure: a servo held at stall overheats and
# strips gears. Speed is a no-load figure and drops sharply under load.
limit_derate:
  effort: 1.0      # effort limit may reach stall, ros2_control clamps there
  velocity: 0.55   # ~55% of no-load is realistic under load

links:
  base_link:
    geometry: {type: box, x: 0.100, y: 0.100, z: 0.030}
    mass: 0.250
    provenance: estimated
  shoulder_link:
    geometry: {type: cylinder, radius: 0.022, length: 0.040}
    mass: 0.060
    provenance: estimated
  upper_arm_link:
    geometry: {type: box, x: 0.020, y: 0.030, z: 0.110}
    mass: 0.055
    provenance: estimated
  forearm_link:
    geometry: {type: box, x: 0.018, y: 0.026, z: 0.095}
    mass: 0.045
    provenance: estimated
  wrist_link:
    geometry: {type: cylinder, radius: 0.016, length: 0.030}
    mass: 0.030
    provenance: estimated
  gripper_base_link:
    geometry: {type: box, x: 0.030, y: 0.040, z: 0.025}
    mass: 0.035
    provenance: estimated
  gripper_left_finger_link:
    geometry: {type: box, x: 0.008, y: 0.006, z: 0.035}
    mass: 0.006
    provenance: estimated
  gripper_right_finger_link:
    geometry: {type: box, x: 0.008, y: 0.006, z: 0.035}
    mass: 0.006
    provenance: estimated

joints:
  shoulder_pan_joint:
    type: revolute
    servo: mg996r
    parent: base_link
    child: shoulder_link
    origin: {xyz: [0.0, 0.0, 0.030], rpy: [0.0, 0.0, 0.0]}
    axis: [0, 0, 1]
    limit: {lower_deg: -90.0, upper_deg: 90.0, effort: 0.922, velocity: 3.0}
    initial_position_deg: 0.0
  shoulder_lift_joint:
    type: revolute
    servo: mg996r
    parent: shoulder_link
    child: upper_arm_link
    origin: {xyz: [0.0, 0.0, 0.020], rpy: [0.0, 0.0, 0.0]}
    axis: [0, 1, 0]
    # Asymmetric on purpose: the arm cannot fold back through its own base.
    limit: {lower_deg: -15.0, upper_deg: 120.0, effort: 0.922, velocity: 3.0}
    initial_position_deg: 0.0
  elbow_joint:
    type: revolute
    servo: mg996r
    parent: upper_arm_link
    child: forearm_link
    origin: {xyz: [0.0, 0.0, 0.110], rpy: [0.0, 0.0, 0.0]}
    axis: [0, 1, 0]
    limit: {lower_deg: -120.0, upper_deg: 10.0, effort: 0.922, velocity: 3.0}
    initial_position_deg: 0.0
  wrist_joint:
    type: revolute
    servo: sg90
    parent: forearm_link
    child: wrist_link
    origin: {xyz: [0.0, 0.0, 0.095], rpy: [0.0, 0.0, 0.0]}
    axis: [0, 1, 0]
    limit: {lower_deg: -90.0, upper_deg: 90.0, effort: 0.177, velocity: 4.8}
    initial_position_deg: 0.0
  gripper_left_finger_joint:
    type: prismatic
    servo: sg90
    # Prismatic effort is a FORCE (N), so it depends on the horn
    # radius of a linkage that does not exist yet. 15 N ~= the sg90
    # stall torque through a 12 mm horn. provenance: estimated.
    servo_horn_radius_m: 0.012
    parent: gripper_base_link
    child: gripper_left_finger_link
    origin: {xyz: [0.0, 0.010, 0.025], rpy: [0.0, 0.0, 0.0]}
    axis: [0, 1, 0]
    # Deliberately below the ~14.7 N ceiling (sg90 stall through a
    # 12 mm horn): a gripper configured at stall crushes what it
    # picks up and cooks the servo holding it closed.
    limit: {lower: 0.0, upper: 0.018, effort: 10.0, velocity: 0.05}
    initial_position: 0.0
  gripper_right_finger_joint:
    type: prismatic
    parent: gripper_base_link
    child: gripper_right_finger_link
    origin: {xyz: [0.0, -0.010, 0.025], rpy: [0.0, 0.0, 0.0]}
    axis: [0, -1, 0]
    # Deliberately below the ~14.7 N ceiling (sg90 stall through a
    # 12 mm horn): a gripper configured at stall crushes what it
    # picks up and cooks the servo holding it closed.
    limit: {lower: 0.0, upper: 0.018, effort: 10.0, velocity: 0.05}
    initial_position: 0.0
    # The right finger follows the left through the URDF <mimic> tag, which
    # both mock_components and gz_ros2_control parse. It therefore gets no
    # <joint> entry in the ros2_control block -- it is not independently
    # commanded.
    mimic: {joint: gripper_left_finger_joint, multiplier: 1.0, offset: 0.0}

# Fixed attachment points. No mass, no geometry -- pure frames.
frames:
  tool0:
    parent: wrist_link
    xyz: [0.0, 0.0, 0.030]
    rpy: [0.0, 0.0, 0.0]
  gripper_base_mount:
    parent: wrist_link
    xyz: [0.0, 0.0, 0.015]
    rpy: [0.0, 0.0, 0.0]
  grasp_frame:
    parent: gripper_base_link
    xyz: [0.0, 0.0, 0.055]
    rpy: [0.0, 0.0, 0.0]
  camera_mount_link:
    parent: base_link
    xyz: [0.045, 0.0, 0.030]
    # POSITIVE pitch tilts the camera DOWN, toward the workspace.
    #
    # This was -0.35 and aimed the camera at the ceiling. Caught by
    # test_kinematics, before any camera existed: the REP-103 optical
    # rotation maps optical +Z onto camera_link +X, and a NEGATIVE pitch
    # about Y then rotates that forward axis upward. Exactly the sign
    # error that costs a day in Phase 12.
    rpy: [0.0, 0.35, 0.0]
  imu_link:
    parent: base_link
    xyz: [0.0, 0.0, 0.015]
    rpy: [0.0, 0.0, 0.0]
  # Phase 11 attaches the mobile base HERE. Costs one fixed joint now and
  # turns "re-parent the arm onto a rover" into a one-line change.
  mount_plate_link:
    parent: base_link
    xyz: [0.0, 0.0, -0.015]
    rpy: [0.0, 0.0, 0.0]

sensors:
  camera:
    enabled: true
    parent: camera_mount_link
    # REP-103 optical frame: +z forward, +x right, +y down. Getting this
    # wrong is the single most common perception bug and costs a day in
    # Phase 8; it costs one fixed joint here.
    optical_rpy: [-1.5707963, 0.0, -1.5707963]
    width: 640
    height: 480
    hfov_deg: 62.0
    # llvmpipe is CPU rendering. 30 Hz will not hold; do not raise this
    # without measuring.
    update_rate: 15.0
    # Gazebo topic the sensor renders to. The bridge maps it into ROS;
    # see threevn_sim/config/gz_bridge.yaml.
    topic: camera
    # Anything nearer than this is invisible, anything further is not
    # drawn. near must clear the gripper or the robot photographs the
    # inside of its own hand.
    clip_near: 0.02
    clip_far: 8.0

hardware:
  # Phase 5. Declared now so the seam has a concrete shape and the
  # ros2_control block can reference real parameters rather than guesses.
  esp32:
    transport: serial        # serial | tcp
    endpoint: /dev/ttyUSB0
    baud: 921600
    control_rate_hz: 50
