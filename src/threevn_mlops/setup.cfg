[develop]
script_dir=$base/lib/threevn_mlops
[install]
install_scripts=$base/lib/threevn_mlops

# Without this section colcon does not detect that the package uses
# pytest and falls back to `python3 -m unittest`, which collects nothing
# and exits 5 -- reported as a package failure even though every test
# passes when pytest is invoked directly.
[tool:pytest]
testpaths = test
markers =
    linter: ament lint check
    copyright: ament_copyright check
    flake8: ament_flake8 check
    pep257: ament_pep257 check
